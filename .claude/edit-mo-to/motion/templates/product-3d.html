<!--defaults {"image": "", "frame": "card", "card_bg": "#f2f2f4", "card_w": 560, "aspect": 1.25, "radius": 44, "pad": 0.08, "x": 540, "y": 1120, "turn": 24, "tilt": 7, "light": "#ffffff", "shine": 1, "shadow": 0.35, "scale": 1, "height": 1920, "duration": 3.4} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; }
  #gl { position: absolute; inset: 0; width: 1080px; height: {{height}}px; }
  #shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,{{shadow}}), rgba(0,0,0,0)); }
  #src { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0" style="position:absolute;inset:0">
    <div id="shadow"></div>
    <canvas id="gl" width="1080" height="{{height}}"></canvas>
  </div>
  <img id="src" src="{{image}}" alt="" />
</div>
<script>
  // Product photo on a lit 3D card (frame "card") or the cut-out photo itself (frame "none", for a PNG with
  // alpha). It swings in, then turns slowly under a moving key light so its face catches the light once.
  // Transparent background. GSAP drives a plain state object; every update re-renders the WebGL frame,
  // so any seek gives the same picture.
  const D = Number("{{duration}}"), S = Number("{{scale}}"), H = Number("{{height}}");
  const st = window.__p3dState = { ry: -70, rx: 12, y: 60, s: 0.86, o: 0, lx: -1 };
  const tl = gsap.timeline({ paused: true });
  const TURN = Number("{{turn}}"), TILT = Number("{{tilt}}");
  tl.to(st, { ry: -TURN, rx: TILT, y: 0, s: 1, duration: 0.85, ease: "power3.out", onUpdate: () => window.__p3d && window.__p3d() }, 0);
  tl.to(st, { o: 1, duration: 0.25, ease: "power1.out" }, 0);
  tl.to(st, { ry: TURN * 0.8, rx: TILT * 0.6, duration: Math.max(0.5, D - 1.2), ease: "sine.inOut" }, 0.85);
  tl.to(st, { lx: 1, duration: Math.max(0.6, D - 0.8), ease: "sine.inOut" }, 0.4);   // the key light sweeps across
  tl.to(st, { o: 0, s: 0.97, duration: 0.24, ease: "power2.in" }, D - 0.26);
  tl.eventCallback("onUpdate", () => window.__p3d && window.__p3d());
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";
  const S = Number("{{scale}}"), H = Number("{{height}}"), X = Number("{{x}}"), Y = Number("{{y}}");
  const FRAME = "{{frame}}", CW = Number("{{card_w}}") * S, R = Number("{{radius}}") * S, PAD = Number("{{pad}}");
  let CH = CW * Number("{{aspect}}");
  const canvas = document.getElementById("gl"), img = document.getElementById("src"), shadow = document.getElementById("shadow");
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
  renderer.setPixelRatio(1); renderer.setSize(1080, H, false); renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
  // 1 world unit = 1 canvas px at z = 0
  const fov = 28, camera = new THREE.PerspectiveCamera(fov, 1080 / H, 10, 20000);
  camera.position.set(0, 0, (H / 2) / Math.tan(THREE.MathUtils.degToRad(fov / 2)));
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.85));
  const key = new THREE.PointLight(new THREE.Color("{{light}}"), 3.2 * Number("{{shine}}"), 0, 0);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.45); fill.position.set(-400, 300, 900); scene.add(fill);
  const group = new THREE.Group(); group.position.set(X - 540, -(Y - H / 2), 0); scene.add(group);
  let mesh = null, faceMat = null;

  function cardGeometry(w, h, r, depth) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: depth * 0.35, bevelSize: depth * 0.35, bevelSegments: 4, curveSegments: 18 });
    g.translate(0, 0, -depth / 2);
    // caps take the photo: map their UVs to the card's 0..1 box (ExtrudeGeometry leaves them in shape units)
    const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h);
    uv.needsUpdate = true;
    return g;
  }
  function build() {
    const tex = new THREE.Texture();
    if (FRAME === "none") {
      if (img.naturalWidth) CH = CW * img.naturalHeight / img.naturalWidth;
      tex.image = img;
      faceMat = new THREE.MeshPhysicalMaterial({ map: tex, transparent: true, alphaTest: 0.02, roughness: 0.42, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.3, side: THREE.DoubleSide });
      mesh = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), faceMat);
    } else {
      // the photo composited onto the card colour, contained with padding
      const c = document.createElement("canvas"), k = 2; c.width = Math.round(CW * k); c.height = Math.round(CH * k);
      const x2 = c.getContext("2d"); x2.fillStyle = "{{card_bg}}"; x2.fillRect(0, 0, c.width, c.height);
      if (img.naturalWidth) {
        const bw = c.width * (1 - 2 * PAD), bh = c.height * (1 - 2 * PAD), f = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
        const w = img.naturalWidth * f, h = img.naturalHeight * f;
        x2.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
      }
      tex.image = c;
      faceMat = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.4, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, transparent: true });
      const side = new THREE.MeshPhysicalMaterial({ color: new THREE.Color("{{card_bg}}").multiplyScalar(0.82), roughness: 0.45, clearcoat: 0.6, transparent: true });
      mesh = new THREE.Mesh(cardGeometry(CW, CH, Math.min(R, CW / 2, CH / 2), 14 * S), [faceMat, side]);
    }
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
    group.add(mesh);
  }
  function frame() {
    if (!mesh) return;
    const st = window.__p3dState;
    group.rotation.set(THREE.MathUtils.degToRad(st.rx), THREE.MathUtils.degToRad(st.ry), 0);
    group.position.y = -(Y - H / 2) - st.y * S;
    group.scale.setScalar(st.s);
    (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(m => { m.opacity = st.o; });
    // key light travels in front of the card, left to right, slightly above: one highlight crosses the face
    key.position.set(group.position.x + st.lx * CW * 1.1, group.position.y + CH * 0.35, CW * 0.9);
    renderer.render(scene, camera);
    // soft floor shadow tracks the turn (narrower when the card is edge-on)
    const w = CW * (0.55 + 0.45 * Math.abs(Math.cos(group.rotation.y))) * st.s;
    Object.assign(shadow.style, { width: w + "px", height: CW * 0.16 + "px", left: (X - w / 2) + "px",
      top: (Y + CH / 2 * st.s + 40 * S + st.y * S) + "px", opacity: st.o });
  }
  const ready = () => { if (!mesh) build(); frame(); };
  window.__p3d = frame;
  if (img.complete && (img.naturalWidth || !img.getAttribute("src"))) ready();
  else { img.addEventListener("load", ready); img.addEventListener("error", ready); }
</script>
</body>
</html>
