<!--defaults {"mode": "badges", "badges": "12 mg|MCT oil|vitamin E|1 a day|lab-tested", "icons": "softgel|drop|leaf|sun|check", "times": "0.3,0.9,1.5,2.1,2.7", "slots": "230,620;850,740;200,1030;880,1120;840,1360", "tilt": 4, "size": 46, "bg": "", "fg": "#5a1426", "edge": "#f0cdbf", "accent": "#6fb4e6", "marker": "#ffe45c", "font": "Inter", "font2": "Playfair Display", "rows": 26, "cx": 540, "cy": 930, "card_w": 720, "seed": 3, "height": 1920, "duration": 4} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@700;800&family={{font2}}:ital,wght@1,700&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; -webkit-font-smoothing: antialiased; font-family: "{{font}}", sans-serif; }
  #bg { position: absolute; inset: 0; background: {{bg}}; }
  #stage { position: absolute; inset: 0; }
  .b { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 16px; white-space: nowrap; opacity: 0;
       background: #fff; color: {{fg}}; border: 2.5px solid {{edge}}; border-radius: 999px; padding: 14px 32px 14px 18px;
       font-weight: 800; font-size: {{size}}px; letter-spacing: -.005em; line-height: 1;
       box-shadow: 0 16px 36px rgba(60,20,30,.16), 0 2px 6px rgba(60,20,30,.08); }
  .b .ic { width: calc({{size}}px * 1.3); height: calc({{size}}px * 1.3); border-radius: 50%; background: {{edge}}; display: grid; place-items: center; flex: none; }
  .b .ic svg { width: 62%; height: 62%; fill: none; stroke: {{fg}}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .b em { font-family: "{{font2}}", serif; font-style: italic; font-weight: 700; font-size: 1.28em; margin-right: -4px; }
  #card { position: absolute; background: #fff; border-radius: 12px; padding: 44px 40px; opacity: 0; box-shadow: 0 34px 80px rgba(40,20,30,.28), 0 2px 10px rgba(40,20,30,.12); }
  #card .r { height: 14px; border-radius: 7px; background: #aeb6c0; filter: blur(3px); margin-bottom: 15px; }
  #card .r.h { height: 30px; background: #6d7683; margin-bottom: 22px; }
  #card .r.rule { height: 6px; background: #3f4650; filter: blur(1.5px); margin: 10px 0 20px; }
  #card .line { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"><div id="card"></div></div>
</div>
<script>
  // mode "badges": pill badges pop around the centred product (slots = x,y;x,y;... pill centres), each on its time
  // (times, seconds from the overlay start = the spoken word), then float gently. A leading digit makes the number
  // a serif italic. icons: softgel drop leaf sun check (per badge, same order).
  // mode "label": a generic, brandless ingredient-list label (blurred bars, no wording) pushes in for a beat; use it
  // on 'blend of ten things' with a short duration (~1.5 s).
  const D = Number("{{duration}}"), MODE = "{{mode}}", TILT = Number("{{tilt}}");
  let sd = Number("{{seed}}"); const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const stage = document.getElementById("stage"), tl = gsap.timeline({ paused: true });
  const ICONS = {
    softgel: '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-30 12 12)"/><path d="M10 9.5l4 5" /></svg>',
    drop: '<svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.4 6 7.2 6 10.4A6 6 0 0 1 6 13.4C6 10.2 8.5 7.4 12 3z"/></svg>',
    leaf: '<svg viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19L13 11"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M8.5 12l2.5 2.5L15.5 9.5"/></svg>'
  };
  if (MODE === "label") {
    const card = document.getElementById("card"), W = Number("{{card_w}}"), N = Math.round(Number("{{rows}}"));
    card.style.width = W + "px";
    const row = (cls, w) => { const r = document.createElement("div"); r.className = "r " + (cls || ""); r.style.width = w + "%"; return r; };
    card.appendChild(row("h", 62)); card.appendChild(row("", 40)); card.appendChild(row("rule", 100));
    for (let i = 0; i < N; i++) {
      const ln = document.createElement("div"); ln.className = "line";
      ln.appendChild(row("", 34 + Math.round(rnd() * 40))); ln.appendChild(row("", 8 + Math.round(rnd() * 8)));
      card.appendChild(ln); if (i % 6 === 5) card.appendChild(row("rule", 100));
    }
    card.appendChild(row("", 90)); card.appendChild(row("", 70));
    card.style.left = Math.round(Number("{{cx}}") - W / 2) + "px"; card.style.top = Math.round(Number("{{cy}}") - card.offsetHeight / 2) + "px";
    card.style.transform = "rotate(-2deg)";
    tl.fromTo(card, { opacity: 0, scale: 0.9, y: 40, rotation: -5 }, { opacity: 1, scale: 1, y: 0, rotation: -2, duration: 0.3, ease: "power3.out" }, 0);
    tl.to(card, { scale: 1.05, duration: D - 0.3, ease: "none" }, 0.3);
    tl.to(card, { opacity: 0, y: -30, duration: 0.18, ease: "power2.in" }, D - 0.18);
  } else {
    document.getElementById("card").remove();
    const items = "{{badges}}".split("|").map(s => s.trim()).filter(Boolean), icons = "{{icons}}".split("|").map(s => s.trim());
    const times = "{{times}}".split(",").map(Number);
    const slots = "{{slots}}".split(";").map(s => s.split(",").map(Number));
    items.forEach((txt, i) => {
      const b = document.createElement("div"); b.className = "b";
      const m = txt.match(/^(\d+)\s*(.*)$/);
      b.innerHTML = `<span class="ic">${ICONS[icons[i]] || ICONS.check}</span><span class="t"></span>`;
      const t = b.querySelector(".t");
      if (m) { const em = document.createElement("em"); em.textContent = m[1]; t.appendChild(em); t.appendChild(document.createTextNode(m[2] ? " " + m[2] : "")); } else t.textContent = txt;
      stage.appendChild(b);
      const s = slots[i] || [540, 700 + i * 140], w = b.offsetWidth, h = b.offsetHeight;
      b.style.left = Math.round(Math.max(24, Math.min(1056 - w, s[0] - w / 2))) + "px"; b.style.top = Math.round(s[1] - h / 2) + "px";
      const T = isFinite(times[i]) ? times[i] : 0.3 + i * 0.6, rot = (i % 2 ? 1 : -1) * TILT * (0.6 + rnd() * 0.6);
      tl.set(b, { opacity: 1 }, T);
      tl.fromTo(b, { scale: 0.5, rotation: rot * 2.2, y: 26, opacity: 0 }, { scale: 1, rotation: rot, y: 0, opacity: 1, duration: 0.34, ease: "back.out(1.5)", immediateRender: false }, T);
      tl.to(b, { y: (i % 2 ? 7 : -7), duration: Math.max(0.5, D - T - 0.55), ease: "sine.inOut" }, T + 0.34);
      tl.to(b, { opacity: 0, scale: 0.92, duration: 0.18, ease: "power2.in" }, D - 0.18);
    });
  }
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
