<!--defaults {"value": "0:25", "from": "0:00", "label": "RAW TAKE", "x": 540, "y": 520, "size": 150, "bg": "#1b1d21", "fg": "#f4f2ec", "accent": "#e8c15a", "font": "Inter", "t_start": 0.25, "spin": 1.1, "stagger": 0.14, "height": 1920, "duration": 3} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@600;800&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  /* (x, y) = centre of the panel */
  #panel { position: absolute; left: {{x}}px; top: {{y}}px; padding: 26px 40px 34px; border-radius: 22px; background: {{bg}};
           box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 16px 40px rgba(0,0,0,.4); text-align: center; width: max-content; max-width: 980px; }
  #lab { font-weight: 800; font-size: 26px; letter-spacing: .5em; color: {{accent}}; margin-bottom: 14px; padding-left: .5em; }
  #row { display: flex; justify-content: center; align-items: flex-start; color: {{fg}}; font-weight: 800; font-size: {{size}}px; line-height: 1.08; font-variant-numeric: tabular-nums; }
  .col { height: 1.08em; overflow: hidden; position: relative; padding: 0 .03em; }
  .col.d { min-width: .62em; background: linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.015) 50%, rgba(0,0,0,.18) 50%, rgba(0,0,0,.05)); border-radius: 10px; margin: 0 .03em; }
  .strip { display: block; will-change: transform; }
  .strip i { display: block; font-style: normal; height: 1.08em; text-align: center; }
  .sep { padding: 0 .02em; overflow: visible; height: auto; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <div id="panel"><div id="lab">{{label}}</div><div id="row"></div></div>
  </div>
</div>
<script>
  const D = Number("{{duration}}"), T0 = Number("{{t_start}}"), SP = Number("{{spin}}"), ST = Number("{{stagger}}");
  const to = "{{value}}", fr = "{{from}}".padEnd(to.length, "0").slice(0, to.length);
  const row = document.getElementById("row"), tl = gsap.timeline({ paused: true });
  const strips = [];
  [...to].forEach((ch, i) => {
    const col = document.createElement("span");
    if (!/\d/.test(ch)) { col.className = "col sep"; col.textContent = ch; row.appendChild(col); return; }
    col.className = "col d"; col.setAttribute("data-layout-allow-overflow", ""); const s = document.createElement("span"); s.className = "strip";
    for (let k = 0; k < 20; k++) { const c = document.createElement("i"); c.textContent = String(k % 10); s.appendChild(c); }
    col.appendChild(s); row.appendChild(col);
    const a = /\d/.test(fr[i]) ? Number(fr[i]) : 0, b = 10 + Number(ch);   // always roll forward at least one full turn
    strips.push({ s, a, b, i });
  });
  strips.forEach(({ s, a, b }, n) => {
    const em = 1.08, st = { v: a };
    s.style.transform = "translateY(" + (-a * em) + "em)";
    // each digit's roll eases out so the last digit lands first-in-last-out, like a mechanical counter
    tl.to(st, { v: b, duration: SP, ease: "power3.out", onUpdate() { s.style.transform = "translateY(" + (-st.v * em) + "em)"; } }, T0 + n * ST);
  });
  gsap.set("#panel", { xPercent: -50, yPercent: -50 });
  tl.from("#panel", { y: 30, opacity: 0, scale: 0.94, duration: 0.3, ease: "power3.out" }, 0);
  tl.to("#panel", { opacity: 0, duration: 0.15, ease: "power1.in" }, D - 0.16);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
