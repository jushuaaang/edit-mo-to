<!--defaults {"text": "LIPOSOMAL R-ALA", "x": 760, "y": 1300, "side": "left", "bg": "#ffffff", "fg": "#0b1a3a", "dot": "#ffd23f", "font": "Montserrat", "size": 46, "duration": 2.5} -->
<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@800&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; font-weight: 800; }
  #dot { position: absolute; left: calc({{x}}px - 22px); top: calc({{y}}px - 22px); width: 44px; height: 44px; border-radius: 50%;
         background: {{dot}}; border: 6px solid #fff; box-shadow: 0 0 0 0 rgba(255,210,63,.7); }
  #line { position: absolute; top: calc({{y}}px - 3px); height: 6px; width: 0; background: #fff; }
  #tag { position: absolute; top: calc({{y}}px - {{size}}px * 1.05); background: {{bg}}; color: {{fg}}; font-size: {{size}}px;
         padding: 18px 30px; border-radius: 18px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
  <div id="dot" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="line" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"></div>
  <div id="tag" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="2">{{text}}</div>
</div>
<script>
  const D = {{duration}}, X = {{x}}, LEN = 120, LEFT = "{{side}}" === "left";
  const tag = document.getElementById("tag"), line = document.getElementById("line");
  line.style.left = (LEFT ? X - LEN : X) + "px";
  if (LEFT) { tag.style.right = (1080 - (X - LEN)) + "px"; } else { tag.style.left = (X + LEN) + "px"; }
  gsap.set(line, { transformOrigin: LEFT ? "right center" : "left center" });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#dot", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 0);
  tl.fromTo(line, { width: 0 }, { width: LEN, duration: 0.25, ease: "power2.out" }, 0.15);
  tl.fromTo("#tag", { opacity: 0, x: LEFT ? 40 : -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.3);
  tl.to("#dot", { boxShadow: "0 0 0 26px rgba(255,210,63,0)", duration: 0.9, repeat: Math.max(0, Math.floor((D - 0.8) / 0.9) - 1) }, 0.3);
  tl.to(["#dot", line, "#tag"], { opacity: 0, duration: 0.2 }, D - 0.22);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
