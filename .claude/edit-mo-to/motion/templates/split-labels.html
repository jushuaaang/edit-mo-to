<!--defaults {"top_label": "BEFORE", "bottom_label": "AFTER", "divider": "#ffffff", "fg": "#ffffff", "font": "Montserrat", "duration": 3} -->
<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@900&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; font-weight: 900; }
  #line { position: absolute; top: 957px; left: 0; height: 6px; width: 1080px; background: {{divider}}; transform-origin: center; }
  .lab { position: absolute; left: 40px; color: {{fg}}; font-size: 64px; -webkit-text-stroke: 8px #000; paint-order: stroke fill; }
  #t { top: 860px; } #b { top: 985px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
  <div id="line" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="t" class="lab clip" data-start="0" data-duration="{{duration}}" data-track-index="1">{{top_label}}</div>
  <div id="b" class="lab clip" data-start="0" data-duration="{{duration}}" data-track-index="2">{{bottom_label}}</div>
</div>
<script>
  const D = {{duration}};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0);
  tl.from("#t", { x: -80, opacity: 0, duration: 0.3, ease: "power3.out" }, 0.15);
  tl.from("#b", { x: -80, opacity: 0, duration: 0.3, ease: "power3.out" }, 0.25);
  tl.to(["#line", "#t", "#b"], { opacity: 0, duration: 0.2 }, D - 0.22);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
