<!--defaults {"mode": "badges", "badges": "12 mg|MCT oil|vitamin E|1 a day|lab-tested", "icons": "softgel|drop|leaf|sun|check", "times": "0.3,0.9,1.5,2.1,2.7", "slots": "250,300;830,300;250,1640;830,1640;540,1780", "ghost": 1, "t_ghost": 0, "size": 44, "bg": "", "fg": "#5a1426", "edge": "#f0cdbf", "accent": "#6fb4e6", "font": "Inter", "font2": "Playfair Display", "rows": 26, "cx": 540, "cy": 930, "card_w": 720, "seed": 3, "height": 1920, "duration": 4} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@700;800&family={{font2}}:ital,wght@1,700&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; -webkit-font-smoothing: antialiased; font-family: "{{font}}", sans-serif; }
  #bg { position: absolute; inset: 0; background: {{bg}}; }
  #stage { position: absolute; inset: 0; }
  .b { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 18px; white-space: nowrap; opacity: 0;
       background: #fff; color: {{fg}}; border-radius: 30px; padding: 16px 34px 16px 16px;
       font-weight: 800; font-size: {{size}}px; letter-spacing: -.01em; line-height: 1;
       box-shadow: 0 22px 48px rgba(60,20,30,.14), 0 6px 14px rgba(60,20,30,.07), 0 0 0 1px rgba(90,20,38,.06); }
  .b .ic { width: calc({{size}}px * 1.55); height: calc({{size}}px * 1.55); border-radius: 20px; background: {{edge}}; display: grid; place-items: center; flex: none; }
  .b .ic svg { width: 56%; height: 56%; fill: none; stroke: {{fg}}; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .b em { font-family: "{{font2}}", serif; font-style: italic; font-weight: 700; font-size: 1.22em; font-variant-numeric: lining-nums; margin-right: -2px; }
  .g { position: absolute; border: 2.5px dashed {{edge}}; border-radius: 30px; opacity: 0; }
  #card { position: absolute; background: #fff; border-radius: 12px; padding: 44px 40px; opacity: 0; box-shadow: 0 34px 80px rgba(40,20,30,.24), 0 2px 10px rgba(40,20,30,.1); }
  #card .r { height: 14px; border-radius: 7px; background: #aeb6c0; filter: blur(3px); margin-bottom: 15px; }
  #card .r.h { height: 30px; background: #6d7683; margin-bottom: 22px; }
  #card .r.rule { height: 6px; background: #3f4650; filter: blur(1.5px); margin: 10px 0 20px; }
  #card .line { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"><div id="card"></div></div>
</div>
<script>
  // badge-pop v2. mode "badges": clean white UI chips (square line-icon tile, heavy sans, a leading number in
  // serif italic) drop into slots around the centred product, like items landing in calendar slots: with ghost=1
  // a faint dashed slot outline shows at each slot from t_ghost, and each chip drops from above, blur-to-sharp,
  // into its slot on its time (times = the spoken word), then breathes gently. slots = x,y;x,y (chip centres) -
  // keep them clear of the product label. icons: softgel drop leaf sun check.
  // mode "label": a generic, brandless ingredient-list label (blurred bars, no wording) pushes in blur-to-sharp.
  const D = Number("{{duration}}"), MODE = "{{mode}}";
  const dec = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
  let sd = Number("{{seed}}"); const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const stage = document.getElementById("stage"), tl = gsap.timeline({ paused: true });
  const ICONS = {
    softgel: '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-30 12 12)"/><path d="M10 9.5l4 5" /></svg>',
    drop: '<svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.4 6 7.2 6 10.4A6 6 0 0 1 6 13.4C6 10.2 8.5 7.4 12 3z"/></svg>',
    leaf: '<svg viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19L13 11"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M8.5 12l2.5 2.5L15.5 9.5"/></svg>'
  };
  if (MODE === "label") {
    const card = document.getElementById("card"), W = Number("{{card_w}}"), N = Math.round(Number("{{rows}}"));
    card.style.width = W + "px";
    const row = (cls, w) => { const r = document.createElement("div"); r.className = "r " + (cls || ""); r.style.width = w + "%"; return r; };
    card.appendChild(row("h", 62)); card.appendChild(row("", 40)); card.appendChild(row("rule", 100));
    for (let i = 0; i < N; i++) {
      const ln = document.createElement("div"); ln.className = "line";
      ln.appendChild(row("", 34 + Math.round(rnd() * 40))); ln.appendChild(row("", 8 + Math.round(rnd() * 8)));
      card.appendChild(ln); if (i % 6 === 5) card.appendChild(row("rule", 100));
    }
    card.appendChild(row("", 90)); card.appendChild(row("", 70));
    card.style.left = Math.round(Number("{{cx}}") - W / 2) + "px"; card.style.top = Math.round(Number("{{cy}}") - card.offsetHeight / 2) + "px";
    tl.fromTo(card, { opacity: 0, scale: 0.92, y: 50, rotation: -4, filter: "blur(16px)" }, { opacity: 1, scale: 1, y: 0, rotation: -2, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
    tl.to(card, { scale: 1.05, duration: Math.max(0.2, D - 0.4), ease: "none" }, 0.4);
    tl.to(card, { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, D - 0.18);
  } else {
    document.getElementById("card").remove();
    const items = dec("{{badges}}").split("|").map(s => s.trim()).filter(Boolean), icons = "{{icons}}".split("|").map(s => s.trim());
    const times = "{{times}}".split(",").map(Number), slots = "{{slots}}".split(";").map(s => s.split(",").map(Number));
    const TG = Number("{{t_ghost}}");
    items.forEach((txt, i) => {
      const b = document.createElement("div"); b.className = "b";
      const m = txt.match(/^(\d{2,})\s*(.*)$/);
      b.innerHTML = `<span class="ic">${ICONS[icons[i]] || ICONS.check}</span><span class="t"></span>`;
      const t = b.querySelector(".t");
      if (m) { const em = document.createElement("em"); em.textContent = m[1]; t.appendChild(em); t.appendChild(document.createTextNode(m[2] ? " " + m[2] : "")); } else t.textContent = txt;
      stage.appendChild(b);
      const s = slots[i] || [540, 300 + i * 140], w = b.offsetWidth, h = b.offsetHeight;
      const L = Math.round(Math.max(24, Math.min(1056 - w, s[0] - w / 2))), Tp = Math.round(s[1] - h / 2);
      b.style.left = L + "px"; b.style.top = Tp + "px";
      const T = isFinite(times[i]) ? times[i] : 0.3 + i * 0.6;
      if ("{{ghost}}" === "1") {
        const g = document.createElement("div"); g.className = "g"; g.style.cssText = `left:${L}px;top:${Tp}px;width:${w}px;height:${h}px`; stage.insertBefore(g, stage.firstChild);
        tl.fromTo(g, { opacity: 0, scale: 0.96 }, { opacity: 0.9, scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, Math.min(TG + i * 0.05, T - 0.3));
        tl.to(g, { opacity: 0, duration: 0.15 }, T + 0.3);
      }
      tl.fromTo(b, { opacity: 0, y: -70, filter: "blur(12px)", scale: 1.03 }, { opacity: 1, y: 0, filter: "blur(0px)", scale: 1, duration: 0.46, ease: "back.out(1.15)", immediateRender: false }, T);
      tl.to(b, { y: (i % 2 ? 5 : -5), duration: Math.max(0.5, D - T - 0.7), ease: "sine.inOut" }, T + 0.46);
      tl.to(b, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, D - 0.18);
    });
  }
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
