<!--defaults {"label": "LIMANG RULES", "rules": "Ikaw ang editor|Basahin lahat|Ikaw ang nagde-decide|I-check ang build|May mali? Sabihin agad", "keys": "ang editor|lahat|nagde-decide|ang build|agad", "times": "1.4,3.4,5.5,7.5,9.4", "t_list": "11.4", "list_label": "ANG LIMANG RULES", "rule_word": "RULE", "dark": "#0F0F10", "accent": "#E8481C", "ink": "#111111", "cream": "#F3EEE6", "muted": "#8A847C", "font": "Inter Tight", "mono": "JetBrains Mono", "hud": "1", "hud_label": "EDIT-MO-TO · EXPLAINER", "section": "06 · 5 RULES", "tc_offset": "0", "duration": 14} -->
<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@500;700;800;900&family={{mono}}:wght@500;700&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: {{dark}}; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "{{font}}", sans-serif; color: {{cream}}; -webkit-font-smoothing: antialiased; }
  .fill { position: absolute; inset: 0; }
  #bgbase { background: {{dark}}; }
  #redp { background: {{accent}}; opacity: 0; }
  #iris { position: absolute; left: 940px; top: 520px; width: 40px; height: 40px; border-radius: 50%; background: {{accent}}; transform: scale(0); }
  /* HUD */
  #hud { position: absolute; inset: 0; color: {{cream}}; font-family: "{{mono}}", monospace; font-weight: 700; font-size: 18px; letter-spacing: .18em; }
  .br { position: absolute; width: 34px; height: 34px; border: 0 solid currentColor; opacity: .75; }
  .br.a { left: 40px; top: 40px; border-left-width: 2px; border-top-width: 2px; }
  .br.b { right: 40px; top: 40px; border-right-width: 2px; border-top-width: 2px; }
  .br.c { left: 40px; bottom: 40px; border-left-width: 2px; border-bottom-width: 2px; }
  .br.d { right: 40px; bottom: 40px; border-right-width: 2px; border-bottom-width: 2px; }
  .hl { position: absolute; white-space: nowrap; }
  #hudL { left: 92px; top: 48px; } #hudR { right: 92px; top: 48px; } #hudT { right: 92px; bottom: 48px; }
  #hudT b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 12px; vertical-align: 1px; }
  #cnt { position: absolute; left: 0; right: 0; top: 150px; text-align: center; white-space: nowrap; font-size: 22px; letter-spacing: .3em; }
  #dots { position: absolute; left: 0; right: 0; bottom: 120px; display: flex; justify-content: center; gap: 18px; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; }
  /* intro */
  #ring { position: absolute; left: 960px; top: 540px; }
  #ring i { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; }
  #lab { position: absolute; left: 0; right: 0; top: 680px; text-align: center; font-family: "{{mono}}", monospace; font-weight: 700; font-size: 26px; letter-spacing: .34em; color: {{cream}}; white-space: nowrap; }
  /* rules */
  .rs { position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .rt { width: 1600px; text-align: center; font-weight: 900; font-size: 176px; line-height: 1.04; letter-spacing: -.02em; text-transform: uppercase; }
  .w { display: inline-block; }
  .nw { display: inline-block; white-space: nowrap; }
  .grp { display: inline-block; position: relative; padding: 0 .16em; white-space: nowrap; }
  .grp .ch { display: inline-block; }
  .bk { position: absolute; width: .24em; height: .3em; border: 0 solid; }
  .bk.tl { left: 0; top: .02em; border-left-width: .05em; border-top-width: .05em; }
  .bk.tr { right: 0; top: .02em; border-right-width: .05em; border-top-width: .05em; }
  .bk.bl { left: 0; bottom: .02em; border-left-width: .05em; border-bottom-width: .05em; }
  .bk.br2 { right: 0; bottom: .02em; border-right-width: .05em; border-bottom-width: .05em; }
  .onred { color: {{ink}}; } .onred .bk { border-color: {{ink}}; }
  .ondark { color: {{cream}}; } .ondark .grp { color: {{accent}}; } .ondark .bk { border-color: {{accent}}; }
  /* list */
  #list { position: absolute; left: 330px; width: 1260px; top: 0; bottom: 0; }
  #llab { position: absolute; left: 0; top: 170px; font-family: "{{mono}}", monospace; font-weight: 700; font-size: 24px; letter-spacing: .32em; color: {{accent}}; white-space: nowrap; }
  .row { position: absolute; left: 0; width: 1260px; height: 118px; display: flex; align-items: center; gap: 40px; }
  .row .n { font-family: "{{mono}}", monospace; font-weight: 700; font-size: 32px; color: {{accent}}; width: 60px; flex: none; }
  .row .t { font-weight: 900; font-size: 66px; letter-spacing: -.015em; text-transform: uppercase; white-space: nowrap; color: {{cream}}; }
  .row .t b { color: {{accent}}; font-weight: 900; }
  .row .ln { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{cream}}; opacity: .16; transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
  <div id="bgl" class="clip fill" data-start="0" data-duration="{{duration}}" data-track-index="0"><div id="bgbase" class="fill"></div><div id="redp" class="fill"></div><div id="iris"></div></div>
  <div id="stage" class="clip fill" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div id="cam" class="fill">
      <div id="intro" class="fill"><div id="ring"></div><div id="lab"></div></div>
      <div id="rules" class="fill"></div>
      <div id="list"><div id="llab"></div></div>
    </div>
  </div>
  <div id="hudl" class="clip fill" data-start="0" data-duration="{{duration}}" data-track-index="2">
    <div id="hud"><i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i>
      <div id="hudL" class="hl"></div><div id="hudR" class="hl"></div><div id="hudT" class="hl"><b></b><span></span></div>
      <div id="cnt" class="hl"></div><div id="dots"></div></div>
  </div>
</div>
<script>
  const D = {{duration}};
  const dec = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
  const $ = id => document.getElementById(id);
  const list = s => dec(s).split("|").map(x => x.trim());
  const nums = (s, d) => { const a = dec(s).split(/[|,]/).map(parseFloat); return d.map((v, i) => isFinite(a[i]) ? a[i] : v); };
  const FPS = 30, TC0 = parseFloat(dec("{{tc_offset}}")) || 0;
  const INK = "{{ink}}", CREAM = "{{cream}}";
  const RULES = list("{{rules}}").filter(Boolean).slice(0, 6), KEYS = list("{{keys}}"), N = RULES.length;
  const TIMES = nums("{{times}}", RULES.map((_, i) => 0.8 + i * 2.1));
  const T_LIST = parseFloat(dec("{{t_list}}")) || (TIMES[N - 1] + 2);
  const RW = dec("{{rule_word}}");
  const pad2 = n => String(n).padStart(2, "0");

  $("lab").textContent = dec("{{label}}");
  $("llab").textContent = dec("{{list_label}}");
  $("hudL").textContent = dec("{{hud_label}}");
  $("hudR").textContent = dec("{{section}}");
  if (dec("{{hud}}") === "0") $("hud").style.display = "none";
  for (let i = 0; i < N; i++) { const d = document.createElement("i"); $("dots").appendChild(d); const r = document.createElement("i"); $("ring").appendChild(r); }

  // split a rule at its key: before | [key] | after (key matched case-insensitively; else the last word)
  function splitRule(rule, key) {
    const k = key ? rule.toLowerCase().indexOf(key.toLowerCase()) : -1;
    if (k >= 0) return [rule.slice(0, k), rule.slice(k, k + key.length), rule.slice(k + key.length)];
    const m = rule.match(/^(.*\s)?(\S+)$/);
    return [m[1] || "", m[2], ""];
  }
  const words = (txt, host) => txt.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) { host.appendChild(document.createTextNode(" ")); return; } const s = document.createElement("span"); s.className = "w"; s.textContent = w; host.appendChild(s); });
  RULES.forEach((r, i) => {
    const [a, k, b] = splitRule(r, KEYS[i]);
    const st = document.createElement("div"); st.className = "rs " + (i % 2 ? "ondark" : "onred"); st.id = "r" + i;
    st.setAttribute("data-layout-allow-overlap", "");
    const rt = document.createElement("div"); rt.className = "rt"; st.appendChild(rt);
    words(a, rt);
    const g = document.createElement("span"); g.className = "grp";
    g.innerHTML = '<i class="bk tl"></i><i class="bk tr"></i><i class="bk bl"></i><i class="bk br2"></i>';
    [...k.trim()].forEach(c => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c === " " ? " " : c; g.appendChild(s); });
    // punctuation right after the key stays on the key's line
    const pm = b.match(/^[.,!?;:'")\]]+/);
    if (pm) {
      const nw = document.createElement("span"); nw.className = "nw"; nw.appendChild(g);
      const ps = document.createElement("span"); ps.className = "w"; ps.textContent = pm[0]; nw.appendChild(ps);
      rt.appendChild(nw);
    } else rt.appendChild(g);
    words(pm ? b.slice(pm[0].length) : b, rt);
    $("rules").appendChild(st);
    // list row
    const row = document.createElement("div"); row.className = "row"; row.id = "l" + i;
    row.innerHTML = '<div class="n"></div><div class="t"></div><div class="ln"></div>';
    row.querySelector(".n").textContent = pad2(i + 1);
    const t = row.querySelector(".t"); t.appendChild(document.createTextNode(a)); const bb = document.createElement("b"); bb.textContent = k; t.appendChild(bb); t.appendChild(document.createTextNode(b));
    $("list").appendChild(row);
  });
  // list rows spread over the space under the label
  const rowTop = 230, rowH = Math.min(118, (930 - rowTop) / Math.max(1, N));
  RULES.forEach((_, i) => { const r = $("l" + i); r.style.top = (rowTop + i * rowH) + "px"; r.style.height = rowH + "px"; });

  // ---- auto-fit ----
  function fitW(el, maxW) {
    el.style.fontSize = "";
    const w = el.scrollWidth;
    if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + "px";
  }
  function fitRule(el) {  // at most two lines, never wider than the safe box
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize);
    for (let n = 0; n < 40; n++) {
      const tops = new Set([...el.children].map(c => Math.round(c.offsetTop / fs))), tooTall = tops.size > 2, tooWide = [...el.children].some(c => c.scrollWidth > 1600) || el.scrollWidth > 1600;
      if (!tooTall && !tooWide) break;
      fs *= 0.95; el.style.fontSize = fs + "px";
    }
  }
  function fitAll() {
    document.querySelectorAll(".rt").forEach(fitRule);
    document.querySelectorAll(".row .t").forEach(el => { el.style.fontSize = Math.min(66, rowH * 0.56) + "px"; const w = el.scrollWidth; if (w > 1150) el.style.fontSize = (parseFloat(el.style.fontSize) * 1150 / w) + "px"; });
    fitW($("lab"), 1500); fitW($("llab"), 1200);
  }
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  // ---- timeline ----
  const tl = gsap.timeline({ paused: true });
  const tc = { t: 0 };
  const pad = n => String(Math.floor(n)).padStart(2, "0");
  const setTC = () => { const s = tc.t + TC0; $("hudT").querySelector("span").textContent = "TC " + pad(s / 3600) + ":" + pad((s / 60) % 60) + ":" + pad(s % 60) + ":" + pad(Math.round((s % 1) * FPS) % FPS);
    // rule counter + progress dots follow the playhead
    let k = -1; TIMES.forEach((t, i) => { if (tc.t >= t - 1e-6) k = i; });
    $("cnt").textContent = RW + " " + pad2(Math.max(0, k) + 1) + " / " + pad2(N);
    [...$("dots").children].forEach((d, i) => { d.style.backgroundColor = i <= k ? "currentColor" : "transparent"; });
  };
  tl.to(tc, { t: D, duration: D, ease: "none", onUpdate: setTC }, 0);
  setTC();
  // deterministic pseudo-random (no Math.random: frames must be seek-safe)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // intro: the rule count as a ring of dots, slowly turning
  const T1 = TIMES[0];
  gsap.utils.toArray("#ring i").forEach((d, i) => {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    tl.fromTo(d, { x: 0, y: 0, scale: 0 }, { x: Math.cos(a) * 78, y: Math.sin(a) * 78, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.08 + i * 0.07);
    tl.to(d, { x: 0, y: 0, duration: 0.26, ease: "power3.in" }, Math.max(0.6, T1 - 0.38));
  });
  tl.fromTo("#ring", { rotation: 0 }, { rotation: 70, duration: Math.max(0.4, T1), ease: "none" }, 0);
  tl.fromTo("#lab", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25);
  tl.to("#lab", { opacity: 0, duration: 0.15 }, Math.max(0.6, T1 - 0.38));
  // the dots collapse into one, which opens into the red frame (iris)
  tl.set("#intro", { opacity: 0 }, T1 - 0.12);
  tl.fromTo("#iris", { scale: 0.6 }, { scale: 58, duration: 0.3, ease: "power3.in", immediateRender: false }, T1 - 0.12);
  gsap.set(["#cnt", "#dots"], { opacity: 0 });

  // rules: slam the plain words, then the bracket opens and the key letters tumble in
  RULES.forEach((_, i) => {
    const t = TIMES[i], s = "#r" + i, onRed = i % 2 === 0;
    gsap.set(s, { opacity: 0 });
    tl.set(s, { opacity: 1 }, t);
    tl.set("#redp", { opacity: onRed ? 1 : 0 }, t);
    if (i === 0) tl.set("#iris", { opacity: 0 }, t + 0.2);
    tl.set("#hud", { color: onRed ? INK : CREAM }, t);
    tl.set(["#cnt", "#dots"], { opacity: 1 }, t);
    const ws = gsap.utils.toArray(s + " .w"), chars = gsap.utils.toArray(s + " .ch"), bks = gsap.utils.toArray(s + " .bk");
    tl.fromTo(ws, { opacity: 0, scale: 1.45, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", stagger: 0.07, immediateRender: false }, t);
    const tk = t + Math.min(0.32, 0.12 + ws.length * 0.05);
    tl.fromTo(bks, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.03, immediateRender: false }, tk);
    tl.fromTo(chars, { opacity: 0, y: () => (rnd() - 0.5) * 220, rotation: () => (rnd() - 0.5) * 70, filter: "blur(8px)" },
      { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.36, ease: "back.out(1.7)", stagger: 0.03, immediateRender: false }, tk + 0.04);
    // slam shake + a slow push while it holds
    tl.to(s + " .rt", { x: 7, duration: 0.035, yoyo: true, repeat: 3, ease: "none" }, t + 0.05);
    const next = i < N - 1 ? TIMES[i + 1] : T_LIST;
    tl.fromTo(s + " .rt", { scale: 1 }, { scale: 1.05, duration: Math.max(0.3, next - t), ease: "none", immediateRender: false }, t);
    // whip out just before the next one
    tl.to(s + " .rt", { xPercent: -14, opacity: 0, filter: "blur(16px)", duration: 0.14, ease: "power3.in" }, next - 0.14);
  });

  // final: every rule as a compact numbered list on the dark frame
  tl.set("#redp", { opacity: 0 }, T_LIST);
  tl.set("#hud", { color: CREAM }, T_LIST);
  tl.to(["#cnt", "#dots"], { opacity: 0, duration: 0.15 }, T_LIST - 0.1);
  gsap.set("#list", { opacity: 0 });
  tl.set("#list", { opacity: 1 }, T_LIST);
  tl.fromTo("#llab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, T_LIST);
  RULES.forEach((_, i) => {
    const r = "#l" + i, t = T_LIST + 0.1 + i * 0.1;
    tl.fromTo(r + " .n, " + r + " .t", { opacity: 0, x: 70, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power4.out", stagger: 0.04, immediateRender: false }, t);
    tl.fromTo(r + " .ln", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, t + 0.05);
  });
  // one at a time, each key word flashes in turn: a reading pass down the list while it holds
  RULES.forEach((_, i) => {
    const t = T_LIST + 0.9 + i * 0.22;
    if (t < D - 0.5) tl.fromTo("#l" + i + " .t b", { color: CREAM }, { color: "{{accent}}", duration: 0.3, ease: "power2.out", immediateRender: false }, t);
  });
  tl.to("#cam", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, D - 0.27);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
