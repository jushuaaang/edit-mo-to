<!--defaults {"text": "DROP", "sub": "gravity", "fg": "#14301f", "sub_color": "#9a7b2e", "font": "Inter", "weight": 900, "font2": "Inter", "size": 230, "size_sub": 78, "y": 520, "stagger": 0.09, "fall": 1400, "height": 1920, "duration": 2.6} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@{{weight}}&family={{font2}}:ital,wght@1,500&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  #box { position: absolute; top: {{y}}px; left: 50%; transform: translateX(-50%); text-align: center; width: max-content; }
  #sub { font-family: "{{font2}}", serif; font-style: italic; font-weight: 500; font-size: {{size_sub}}px; color: {{sub_color}}; line-height: 1; margin-bottom: 8px; opacity: 0; text-shadow: 0 2px 10px rgba(255,255,255,.35); }
  #main { font-family: "{{font}}", sans-serif; font-weight: {{weight}}; font-size: {{size}}px; color: {{fg}}; line-height: .95; display: flex; justify-content: center; letter-spacing: -.01em; text-shadow: 0 10px 26px rgba(0,0,0,.28); }
  .c { display: inline-block; will-change: transform; transform-origin: 50% 100%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"><div id="box"><div id="sub">{{sub}}</div><div id="main"></div></div></div>
</div>
<script>
  const D = Number("{{duration}}"), ST = Number("{{stagger}}"), F = Number("{{fall}}");
  const main = document.getElementById("main"), txt = "{{text}}";
  [...txt].forEach(ch => { const s = document.createElement("span"); s.className = "c"; s.textContent = ch === " " ? " " : ch; main.appendChild(s); });
  function fit() { const box = document.getElementById("box"), w = box.getBoundingClientRect().width; if (w > 980) main.style.fontSize = (parseFloat(getComputedStyle(main).fontSize) * 980 / w) + "px"; }
  fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  const cs = main.querySelectorAll(".c"), tl = gsap.timeline({ paused: true });
  gsap.set(cs, { y: -F, opacity: 0 });
  // each letter accelerates in under gravity, lands with a tiny squash and a 6px settle (no bounce)
  cs.forEach((c, i) => {
    const t = 0.1 + i * ST;
    tl.set(c, { opacity: 1 }, t);
    tl.to(c, { y: 0, duration: 0.42, ease: "power3.in" }, t);
    tl.to(c, { scaleY: 0.9, scaleX: 1.06, duration: 0.06, ease: "power1.out" }, t + 0.42);
    tl.to(c, { scaleY: 1, scaleX: 1, y: -6, duration: 0.1, ease: "power1.out" }, t + 0.48);
    tl.to(c, { y: 0, duration: 0.12, ease: "power1.in" }, t + 0.58);
  });
  const end = 0.1 + cs.length * ST + 0.7;
  tl.fromTo("#sub", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, Math.min(end - 0.3, D - 0.8));
  tl.to("#box", { opacity: 0, y: 24, duration: 0.18, ease: "power2.in" }, D - 0.2);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
