<!--defaults {"value": 3, "prefix": "", "suffix": "x", "decimals": 0, "label": "BETTER ABSORBED", "bg": "rgba(10,20,60,0.82)", "fg": "#ffffff", "accent_color": "#4fd1ff", "font": "Montserrat", "top": 520, "duration": 3} -->
<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@700;900&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; }
  #card { position: absolute; top: {{top}}px; left: 50%; min-width: 560px; padding: 34px 60px 38px; border-radius: 36px;
          background: {{bg}}; color: {{fg}}; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.45);
          border: 3px solid {{accent_color}}; }
  #num { font-size: 190px; font-weight: 900; line-height: 1; color: {{accent_color}}; }
  #lab { font-size: 46px; font-weight: 700; letter-spacing: .04em; margin-top: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
  <div id="card" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <div id="num">{{prefix}}<span id="n">0</span>{{suffix}}</div>
    <div id="lab">{{label}}</div>
  </div>
</div>
<script>
  const D = {{duration}}, V = Number("{{value}}"), DEC = Number("{{decimals}}");
  const tl = gsap.timeline({ paused: true });
  const counter = { v: 0 };
  gsap.set("#card", { xPercent: -50 });
  tl.fromTo("#card", { y: 80, opacity: 0, scale: 0.85 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 0);
  tl.to(counter, { v: V, duration: Math.min(1.0, D * 0.4), ease: "power2.out",
                   onUpdate: () => { document.getElementById("n").textContent = counter.v.toFixed(DEC); } }, 0.2);
  tl.to("#card", { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, D - 0.3);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
