<!--defaults {"count": 8, "tone": "#2a3440", "strength": 0.5, "shadow": 0.5, "size": 1.5, "speed": 1, "flick": "", "flick_dir": "1", "seed": 11, "fade_in": 0.6, "height": 1920, "duration": 5} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; }
  svg#s { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <svg id="s" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0" width="1080" height="{{height}}" viewBox="0 0 1080 {{height}}">
    <defs>
      <filter id="b1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" /></filter>
      <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" /></filter>
    </defs>
    <g id="sh" filter="url(#b2)"></g>
    <g id="fl" filter="url(#b1)"></g>
  </svg>
</div>
<script>
  // Translucent vitreous floaters (threads, bead chains, blobs, rings) drifting slowly with a lag, as they do
  // when the eye moves. Each has a soft darker core, a faint light rim and a blurred shadow cast offset behind it.
  // Drift is a pure function of time (seek-safe). flick = "t,t,.." seconds at which the eye flicks: every
  // floater whips along flick_dir (1 = right, -1 = left) and settles back. Place over a sky or white plate.
  const NS = "http://www.w3.org/2000/svg", D = Number("{{duration}}"), H = Number("{{height}}");
  const N = Math.round(Number("{{count}}")), TONE = "{{tone}}", STR = Number("{{strength}}"), SHD = Number("{{shadow}}");
  const SZ = Number("{{size}}"), SP = Number("{{speed}}"), FIN = Number("{{fade_in}}");
  const flicks = "{{flick}}".split(",").map(Number).filter(isFinite), FD = Number("{{flick_dir}}") >= 0 ? 1 : -1;
  let sd = Number("{{seed}}"); const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const fl = document.getElementById("fl"), sh = document.getElementById("sh");
  const kinds = ["thread", "beads", "blob", "ring", "thread", "beads"];
  const items = [];
  function shape(parent, kind, s, dark, rim) {
    const g = mk("g", {}, parent);
    const sw = (a) => a;
    if (kind === "thread") {
      const d = `M ${-70 * s} ${8 * s} q ${22 * s} ${-34 * s} ${42 * s} ${-4 * s} t ${40 * s} ${0} t ${36 * s} ${6 * s} t ${30 * s} ${-14 * s}`;
      if (rim) mk("path", { d, fill: "none", stroke: "#fff", "stroke-width": 11 * s, opacity: .5, "stroke-linecap": "round" }, g);
      mk("path", { d, fill: "none", stroke: TONE, "stroke-width": (dark ? 7 : 8) * s, opacity: dark ? 1 : STR, "stroke-linecap": "round" }, g);
    } else if (kind === "beads") {
      [[-40, 4, 12], [-14, -6, 15], [14, 0, 11], [38, 10, 9]].forEach(b => {
        if (rim) mk("circle", { cx: b[0] * s, cy: b[1] * s, r: (b[2] + 4) * s, fill: "#fff", opacity: .4 }, g);
        mk("circle", { cx: b[0] * s, cy: b[1] * s, r: b[2] * s, fill: TONE, opacity: dark ? 1 : STR }, g);
      });
    } else if (kind === "blob") {
      const d = `M ${-34 * s} 0 C ${-30 * s} ${-26 * s} ${22 * s} ${-30 * s} ${36 * s} ${-4 * s} C ${40 * s} ${24 * s} ${-14 * s} ${30 * s} ${-34 * s} 0 Z`;
      if (rim) mk("path", { d, fill: "none", stroke: "#fff", "stroke-width": 6 * s, opacity: .45 }, g);
      mk("path", { d, fill: TONE, opacity: dark ? 1 : STR * .8 }, g);
    } else {
      if (rim) mk("circle", { r: 31 * s, fill: "none", stroke: "#fff", "stroke-width": 11 * s, opacity: .45 }, g);
      mk("circle", { r: 26 * s, fill: "none", stroke: TONE, "stroke-width": 6 * s, opacity: dark ? 1 : STR }, g);
    }
    return g;
  }
  for (let i = 0; i < N; i++) {
    const kind = kinds[i % kinds.length], s = (0.9 + rnd() * 0.9) * SZ;
    const it = {
      bx: 120 + rnd() * 840, by: H * (0.18 + rnd() * 0.55), ax: 40 + rnd() * 70, ay: 30 + rnd() * 60,
      fx: 0.22 + rnd() * 0.3, fy: 0.18 + rnd() * 0.3, px: rnd() * 6.28, py: rnd() * 6.28, rot: (rnd() - .5) * 60, rs: (rnd() - .5) * 9,
      lag: 0.6 + rnd() * 0.9, el: shape(fl, kind, s, false, true), sh: shape(sh, kind, s * 1.05, true, false), a: 0.65 + rnd() * 0.35
    };
    items.push(it);
  }
  const tl = gsap.timeline({ paused: true }), P = { t: 0 };
  function place(t) {
    // flick kick: eased bump of displacement right after each flick time, relaxing over ~1.1 s, scaled per-floater lag
    let kick = 0, kickY = 0;
    flicks.forEach(ft => { const u = t - ft; if (u > 0 && u < 1.4) { const e = Math.exp(-u * 3.2) * Math.sin(Math.min(1, u / 0.12) * 1.5708); kick += e; kickY += e * 0.12; } });
    items.forEach((it, i) => {
      const tt = t * SP;
      let x = it.bx + Math.sin(tt * it.fx * 6.28 + it.px) * it.ax + FD * kick * 150 * it.lag;
      let y = it.by + Math.sin(tt * it.fy * 6.28 + it.py) * it.ay + (tt * 6 % 1) * 0 + kickY * 40 * it.lag;
      const r = it.rot + it.rs * tt, ap = it.a * Math.min(1, t / FIN);
      it.el.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r.toFixed(1)})`);
      it.el.setAttribute("opacity", ap.toFixed(3));
      // cast shadow: offset down-right, a touch larger, softer
      it.sh.setAttribute("transform", `translate(${(x + 26).toFixed(1)},${(y + 34).toFixed(1)}) rotate(${r.toFixed(1)})`);
      it.sh.setAttribute("opacity", (ap * SHD * 0.45).toFixed(3));
    });
  }
  place(0);
  tl.to(P, { t: D, duration: D, ease: "none", onUpdate: () => place(P.t) }, 0);
  tl.to("#s", { opacity: 0, duration: 0.25, ease: "power2.in" }, D - 0.25);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
