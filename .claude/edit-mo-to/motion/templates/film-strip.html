<!--defaults {"strip": "#0d0d0f", "hole": "#d9d6cd", "width": 78, "pitch": 62, "speed": 220, "tint": "#ffb066", "flicker": 0.08, "grain": 0.1, "height": 1920, "duration": 4} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; }
  /* projector look: two scrolling sprocket strips, a warm flicker wash and light grain; the footage underneath stays untouched */
  .st { position: absolute; top: 0; bottom: 0; width: {{width}}px; background: {{strip}}; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,.5); }
  #L { left: 0; } #R { right: 0; }
  .holes { position: absolute; left: 0; right: 0; top: 0; height: calc(100% + {{pitch}}px * 2); will-change: transform; }
  .holes i { position: absolute; left: 50%; width: calc({{width}}px * 0.42); height: calc({{pitch}}px * 0.58); margin-left: calc({{width}}px * -0.21); border-radius: 6px; background: {{hole}}; }
  #wash { position: absolute; inset: 0; background: {{tint}}; mix-blend-mode: soft-light; opacity: 0; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.42) 100%); }
  #grain { position: absolute; inset: -60px; opacity: {{grain}}; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <div id="vig"></div><div id="wash"></div><div id="grain"></div>
    <div class="st" id="L"><div class="holes"></div></div><div class="st" id="R"><div class="holes"></div></div>
  </div>
</div>
<script>
  const D = Number("{{duration}}"), P = Number("{{pitch}}"), V = Number("{{speed}}"), H = Number("{{height}}"), FL = Number("{{flicker}}");
  const rows = Math.ceil(H / P) + 3;
  document.querySelectorAll(".holes").forEach(h => { for (let k = 0; k < rows; k++) { const i = document.createElement("i"); i.style.top = (k * P + P * 0.2) + "px"; h.appendChild(i); } });
  const tl = gsap.timeline({ paused: true });
  // strips scroll continuously (modulo one pitch so the loop is seamless), and ease in/out at the edges of the beat
  const st = { y: 0 };
  tl.to(st, { y: V * D, duration: D, ease: "none", onUpdate() { const o = -(st.y % P); document.querySelectorAll(".holes").forEach(h => h.style.transform = "translateY(" + o + "px)"); } }, 0);
  tl.from(".st#L", { x: -{{width}}, duration: 0.3, ease: "power3.out" }, 0);
  tl.from(".st#R", { x: {{width}}, duration: 0.3, ease: "power3.out" }, 0);
  tl.from("#vig", { opacity: 0, duration: 0.4 }, 0);
  // seek-safe flicker: fixed steps of the wash opacity, no randomness
  const steps = Math.floor((D - 0.3) / 0.083);
  for (let k = 0; k < steps; k++) tl.set("#wash", { opacity: FL * (0.35 + 0.65 * Math.abs(Math.sin(k * 2.399))) }, k * 0.083);
  for (let k = 0; k < steps; k++) tl.set("#grain", { x: ((k * 37) % 61) - 30, y: ((k * 53) % 59) - 30 }, k * 0.083);
  tl.to("#L", { x: -{{width}}, duration: 0.25, ease: "power2.in" }, D - 0.28);
  tl.to("#R", { x: {{width}}, duration: 0.25, ease: "power2.in" }, D - 0.28);
  tl.to("#vig,#wash,#grain", { opacity: 0, duration: 0.25 }, D - 0.28);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
