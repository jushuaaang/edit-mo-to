<!--defaults {"text": "Make notifications rain down around me", "x": 540, "y": 250, "width": 940, "cps": 20, "t_start": 0.3, "bg": "#fcfcfd", "fg": "#111111", "accent": "#2f6bff", "scale": 1, "font": "Inter", "height": 1920, "duration": 3.5} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@500;600&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; --s: {{scale}};
          -webkit-font-smoothing: antialiased; }
  #bar { position: absolute; top: {{y}}px; width: calc(var(--s) * {{width}}px); height: calc(var(--s) * 104px);
         display: flex; align-items: center; gap: calc(var(--s) * 16px); padding: 0 calc(var(--s) * 18px) 0 calc(var(--s) * 34px);
         border-radius: calc(var(--s) * 30px); background: {{bg}}; color: {{fg}};
         box-shadow: inset 0 0 0 1px color-mix(in srgb, {{fg}} 6%, transparent), 0 2px 6px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.24); }
  #tx { flex: 1; min-width: 0; font-size: calc(var(--s) * 34px); font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;
        overflow: hidden; display: flex; justify-content: flex-start; }
  #caret { display: inline-block; width: 3px; height: 1.1em; background: {{fg}}; margin-left: 2px; vertical-align: -0.15em; }
  #send { flex: none; width: calc(var(--s) * 68px); height: calc(var(--s) * 68px); border-radius: 50%; background: {{fg}};
          display: flex; align-items: center; justify-content: center; }
  #send svg { width: 48%; height: 48%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="bar" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <div id="tx"><span id="typed"></span><span id="caret"></span></div>
    <div id="send"><svg viewBox="0 0 24 24"><path d="M12 18V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke="{{bg}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>
<script>
  // An AI prompt being typed, then sent: for "I asked the AI to…" beats and app/AI product ads.
  const D = Number("{{duration}}"), S = Number("{{scale}}"), CPS = Number("{{cps}}"), T0 = Number("{{t_start}}");
  const TEXT = document.createElement("textarea"); TEXT.innerHTML = "{{text}}"; const full = TEXT.value;
  const bar = document.getElementById("bar"), typed = document.getElementById("typed"), tx = document.getElementById("tx");
  bar.style.left = Math.round(Number("{{x}}") - bar.offsetWidth / 2) + "px";
  const typeDur = Math.min(full.length / CPS, Math.max(0.3, D - T0 - 0.9));
  const st = { n: 0 };
  // long prompts scroll left like a real input, keeping the caret in view. Measured once here, never
  // inside the timeline callback, so seeking stays deterministic.
  const overflowAt = (() => {
    for (let n = 0; n <= full.length; n++) {
      typed.textContent = full.slice(0, n);
      if (tx.scrollWidth > tx.clientWidth) return n;
    }
    return Infinity;
  })();
  function draw() {
    const n = Math.round(st.n);
    typed.textContent = full.slice(0, n);
    tx.style.justifyContent = n >= overflowAt ? "flex-end" : "flex-start";
  }
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(bar, { opacity: 0, y: -24, scale: 0.94, filter: "blur(8px)" },
                 { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.5)" }, 0);
  tl.fromTo(st, { n: 0 }, { n: full.length, duration: typeDur, ease: "none", onUpdate: draw }, T0);
  const blinks = Math.max(1, Math.floor(D / 0.5));
  tl.fromTo("#caret", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: blinks, yoyo: true }, 0);
  const sent = T0 + typeDur + 0.25;
  tl.to("#send", { scale: 0.82, duration: 0.1, ease: "power2.in" }, sent);
  tl.to("#send", { scale: 1, background: "{{accent}}", duration: 0.3, ease: "back.out(3)" }, sent + 0.1);
  tl.to(bar, { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.24, ease: "power2.in" }, D - 0.26);
  window.__timelines["main"] = tl;
  draw();
  tl.seek(0);
</script>
</body>
</html>
