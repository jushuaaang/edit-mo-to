<!--defaults {"text": "Your feet carry you all day", "times": "", "style": "rise", "key": "", "color": "#ffffff", "accent": "#bfc3ca", "accent_fg": "#111114", "font": "Inter", "weights": "300..900", "weight": 800, "size": 124, "case": "upper", "tracking": -0.02, "align": "center", "y": 1060, "max_width": 960, "max_lines": 3, "shadow": 0.35, "t_start": 0.1, "scale": 1, "height": 1920, "duration": 3} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@{{weights}}&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  #t { position: absolute; left: 50%; top: {{y}}px; width: calc({{scale}} * {{max_width}}px); transform: translateX(-50%);
       color: {{color}}; font-weight: {{weight}}; line-height: 1.02; letter-spacing: {{tracking}}em; text-align: {{align}};
       text-shadow: 0 2px 18px rgba(0,0,0,{{shadow}}); }
  #t.upper { text-transform: uppercase; }
  .w { display: inline-block; position: relative; vertical-align: top; white-space: nowrap; }
  .w.mask { clip-path: inset(-0.12em -0.2em -0.22em -0.2em); }
  .w .in { display: inline-block; position: relative; z-index: 1; }
  .l { display: inline-block; white-space: pre; text-align: center; }
  .w.key { color: {{accent}}; }
  .mk { position: absolute; left: -0.12em; right: -0.12em; top: 0.06em; bottom: 0.0em; background: {{accent}}; border-radius: 0.12em;
        transform-origin: 0 50%; z-index: 0; }
  .hl .w.key { color: inherit; }
  .ws .w { text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="t" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
</div>
<script>
  // Kinetic type on the spoken words. Each word lands on its own time (times = seconds from the overlay's
  // start, one per word, from media_timing.py vo; empty = even pacing). Styles:
  //   rise          words rise into a mask letter by letter
  //   scramble      glyphs resolve left to right into each word (deterministic, seek-safe)
  //   weight-shift  the line sits light and dim; each word swells to heavy on its word (variable font)
  //   highlight-word words rise; the key word gets a marker block wiping in behind it
  const D = Number("{{duration}}"), S = Number("{{scale}}"), STYLE = "{{style}}", MAXW = Number("{{max_width}}") * S;
  const W = Number("{{weight}}"), T0 = Number("{{t_start}}"), MAXL = Number("{{max_lines}}") || 3;
  const dec = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  const words = dec("{{text}}").trim().split(/\s+/).filter(Boolean);
  const KEYS = dec("{{key}}").split(/[|,]/).map(norm).filter(Boolean);
  let times = "{{times}}".split(",").map(s => s.trim()).filter(Boolean).map(Number);
  if (times.length < words.length) {   // pad with even pacing after the last given time
    const span = Math.max(0.6, Math.min(words.length * 0.28, D - T0 - 0.8)), step = span / Math.max(1, words.length);
    for (let i = times.length; i < words.length; i++) times.push(i ? (times[i - 1] ?? T0) + step : T0);
  }
  const t = document.getElementById("t");
  if ("{{case}}" === "upper") t.classList.add("upper");
  const els = words.map((w, i) => {
    const el = document.createElement("span"); el.className = "w";
    if (KEYS.includes(norm(w))) el.classList.add("key");
    const inn = document.createElement("span"); inn.className = "in";
    [...w].forEach(ch => { const l = document.createElement("span"); l.className = "l"; l.textContent = ch; l.dataset.c = ch; inn.appendChild(l); });
    el.appendChild(inn);
    if (i) t.appendChild(document.createTextNode(" "));
    t.appendChild(el);
    return el;
  });
  if (STYLE === "highlight-word") { t.classList.add("hl"); els.filter(e => e.classList.contains("key")).forEach(e => {
    const m = document.createElement("span"); m.className = "mk"; e.prepend(m); }); }
  if (STYLE === "rise" || STYLE === "highlight-word") els.forEach(e => e.classList.add("mask"));
  if (STYLE === "weight-shift") t.classList.add("ws");

  // fit: the longest word fits the width and the block stays within max_lines; for weight-shift each word
  // keeps its heavy width so lines never reflow as words swell
  const GLY = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=?";
  const BASE = Number("{{size}}") * S;
  const lines = () => { const tops = new Set(els.map(e => Math.round(e.offsetTop))); return tops.size; };
  function fit() {
    let fs = BASE;
    els.forEach(e => { e.style.width = ""; e.style.fontWeight = ""; e.querySelectorAll(".l").forEach(l => { l.style.width = ""; l.textContent = l.dataset.c; }); });
    t.style.fontSize = fs + "px";
    const widest = Math.max(...els.map(e => e.scrollWidth));
    if (widest > MAXW) { fs *= MAXW / widest; t.style.fontSize = fs + "px"; }
    let guard = 0;
    while (lines() > MAXL && guard++ < 40) { fs *= 0.95; t.style.fontSize = fs + "px"; }
    // scramble: each letter keeps its real width, so random glyphs never shift the line
    // and only draws glyphs that fit its slot (no overlap with its neighbours)
    if (STYLE === "scramble") {
      const k = gsap.getProperty(t, "scale") || 1, probe = document.createElement("span");
      probe.className = "l"; els[0].firstChild.appendChild(probe);
      const gw = [...GLY].map(g => { probe.textContent = g; return probe.getBoundingClientRect().width / k; });
      probe.remove();
      els.forEach(e => e.querySelectorAll(".l").forEach(l => {
        const w = l.getBoundingClientRect().width / k;
        l.style.width = w + "px";
        const ok = [...GLY].filter((g, i) => gw[i] <= w * 1.02);
        l.dataset.g = ok.length ? ok.join("") : l.dataset.c;   // a slot too narrow for any glyph keeps its letter
      }));
    }
    if (STYLE === "weight-shift") els.forEach(e => { e.style.width = Math.ceil(e.getBoundingClientRect().width / (gsap.getProperty(t, "scale") || 1)) + "px"; });
  }
  fit();

  const tl = gsap.timeline({ paused: true });
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return Math.abs(h ^ (h >>> 16)); };
  function build() {
    tl.clear();
    tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0);
    els.forEach((e, i) => {
      const at = times[i], ls = [...e.querySelectorAll(".l")], key = e.classList.contains("key");
      if (STYLE === "scramble") {
        const orig = ls.map(l => l.dataset.c), o = { p: 0 }, n = ls.length;
        const paint = () => ls.forEach((l, j) => {
          if (o.p >= (j + 1) / n || orig[j] === " ") l.textContent = orig[j];
          else { const g = l.dataset.g || GLY; l.textContent = o.p <= 0 ? " " : g[hash(i * 31 + j, Math.floor(o.p * 14)) % g.length]; }
        });
        tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.04 }, at);
        tl.fromTo(o, { p: 0 }, { p: 1, duration: Math.min(0.45, 0.12 + n * 0.04), ease: "none", onUpdate: paint }, at);
        paint();
        gsap.set(e, { opacity: 0 });
      } else if (STYLE === "weight-shift") {
        gsap.set(e, { opacity: 0.38, fontWeight: 300 });
        tl.to(e, { fontWeight: W, opacity: 1, duration: 0.32, ease: "power2.out" }, at);
        tl.fromTo(e.firstChild, { y: 0 }, { y: -0.06 * BASE, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      } else {
        // rise: letters come up into the mask with a short blur, staggered across the word
        tl.fromTo(ls, { yPercent: 140, filter: "blur(6px)" },
                      { yPercent: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out", stagger: Math.min(0.022, 0.16 / ls.length) }, at);
        if (STYLE === "highlight-word" && key) {
          const mk = e.querySelector(".mk");
          tl.fromTo(mk, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, at + 0.06);
          tl.fromTo(e.querySelector(".in"), { color: "{{color}}" }, { color: "{{accent_fg}}", duration: 0.16, ease: "power1.out" }, at + 0.14);
        }
      }
    });
    tl.to(t, { opacity: 0, filter: "blur(6px)", y: -14, duration: 0.22, ease: "power2.in" }, D - 0.25);
    tl.seek(0);
  }
  build();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); build(); });
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
