<!--defaults {"mode": "single", "labels": "vitreous", "t_labels": "2.46", "t_fill": "2.46", "fill": "1", "floaters": "0", "t_draw": 0.1, "x": 430, "y": 900, "scale": 1.1, "bg": "", "ink": "#5a1426", "sky": "#6fb4e6", "marker": "#ffe45c", "floater": "#2d3440", "font": "Inter", "font2": "Playfair Display", "height": 1920, "duration": 3.4} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@700;800&family={{font2}}:ital,wght@1,600&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; background: {{bg}}; }
  svg#s { position: absolute; left: 0; top: 0; overflow: visible; }
  .ln { fill: none; stroke: {{ink}}; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .lbl text { font-family: "{{font}}", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .18em; fill: {{ink}}; text-transform: uppercase; }
  .lbl .ser { font-family: "{{font2}}", serif; font-style: italic; font-weight: 600; letter-spacing: 0; font-size: 38px; text-transform: none; }
  .lead { stroke: {{ink}}; stroke-width: 2.5; fill: none; stroke-linecap: round; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <svg id="s" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1" width="1080" height="{{height}}" viewBox="0 0 1080 {{height}}"></svg>
</div>
<script>
  // Line-drawn eye cross-section (front of the eye faces left). Lines draw on, the lens and retina take sky blue,
  // labels pop on their spoken words (t_labels), and the vitreous fills with yellow marker on t_fill.
  // mode "single" = one eye (block 3); "compare" = clear eye above, an eye with floater clumps below (hooks),
  // labels attach to the lower eye. labels = a|b|c in the order retina, lens, vitreous, floaters (any subset, any order).
  const NS = "http://www.w3.org/2000/svg", D = Number("{{duration}}"), SC = Number("{{scale}}");
  const MODE = "{{mode}}", X = Number("{{x}}"), Y = Number("{{y}}"), TD = Number("{{t_draw}}");
  const INK = "{{ink}}", SKY = "{{sky}}", MARK = "{{marker}}", FL = "{{floater}}";
  const labels = "{{labels}}".split("|").map(s => s.trim()).filter(Boolean);
  const tl_ = "{{t_labels}}".split(",").map(Number), tfill = Number("{{t_fill}}");
  const svg = document.getElementById("s"), tl = gsap.timeline({ paused: true });
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
  // anchor points (eye-local coords) and label spots per label
  const SPOTS = {
    retina:   { p: [166, -166], l: [330, -215], anchor: "start" },
    vitreous: { p: [40, -30],   l: [330, -70],  anchor: "start" },
    floaters: { p: [95, 120],   l: [330, 215],  anchor: "start" },
    lens:     { p: [-120, -58], l: [-150, -300], anchor: "middle" }
  };
  const BACK = 235;
  function eye(cx, cy, id, withClumps, withFill, labelled) {
    const g = mk("g", { transform: `translate(${cx},${cy}) scale(${SC})` });
    const parts = [];
    const defs = mk("defs", {}, g);
    const cp = mk("clipPath", { id: "vc" + id }, defs);
    mk("path", { d: "M -100 -212.7 A 235 235 0 1 1 -100 212.7 Q -40 0 -100 -212.7 Z" }, cp);
    // vitreous fill (under the lines)
    let fillRect = null;
    if (withFill) {
      const fg = mk("g", { "clip-path": `url(#vc${id})` }, g);
      fillRect = mk("rect", { x: -100, y: -230, width: 0, height: 460, fill: MARK, opacity: .85 }, fg);
    }
    const sclera = mk("path", { class: "ln", d: "M -205 -145 A 250 250 0 1 1 -205 145 C -330 90 -330 -90 -205 -145 Z" }, g);
    const retina = mk("path", { class: "ln", d: "M -152 -180 A 235 235 0 1 1 -152 180", stroke: SKY, "stroke-width": 9 }, g);
    const iris1 = mk("path", { class: "ln", d: "M -197 -137 Q -178 -95 -168 -52" }, g);
    const iris2 = mk("path", { class: "ln", d: "M -197 137 Q -178 95 -168 52" }, g);
    const lens = mk("path", { class: "ln", d: "M -122 -64 C -80 -40 -80 40 -122 64 C -160 40 -160 -40 -122 -64 Z", stroke: SKY, "stroke-width": 6 }, g);
    const nerve1 = mk("path", { class: "ln", d: "M 233 30 C 280 34 310 46 345 48" }, g);
    const nerve2 = mk("path", { class: "ln", d: "M 228 78 C 275 82 305 92 340 96" }, g);
    retina.style.stroke = SKY; retina.style.strokeWidth = 9; lens.style.stroke = SKY; lens.style.strokeWidth = 6;
    const all = [sclera, retina, iris1, iris2, lens, nerve1, nerve2];
    all.forEach(p => { p.setAttribute("pathLength", 1); p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1; });
    tl.to(all, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut", stagger: 0.08 }, TD);
    // floater clumps
    const clumps = [];
    if (withClumps) {
      const defs2 = [
        "M 40 70 q 12 -22 26 -4 t 26 -2 t 22 14", "M 120 -40 q -10 18 6 26 t 18 24", "M -20 110 q 14 -12 28 4 t 24 -8",
        "M 80 -100 q 16 6 10 24 t -8 22"
      ];
      defs2.forEach((d, i) => clumps.push(mk("path", { d, fill: "none", stroke: FL, "stroke-width": 9, "stroke-linecap": "round", opacity: 0 }, g)));
      [[60, 55, 9], [75, 62, 6], [130, -30, 8], [14, 98, 7], [95, -78, 10], [110, 100, 6]].forEach(c => clumps.push(mk("circle", { cx: c[0], cy: c[1], r: c[2], fill: FL, opacity: 0 }, g)));
      tl.to(clumps, { opacity: 0.72, duration: 0.5, stagger: 0.07, ease: "power1.out" }, TD + 1.0);
      // slow drift in the hold
      clumps.forEach((c, i) => tl.to(c, { x: (i % 2 ? 9 : -8), y: (i % 3 ? -7 : 8), duration: Math.max(1, D - TD - 1.4), ease: "sine.inOut" }, TD + 1.2));
    }
    // vitreous marker
    if (withFill) tl.to(fillRect, { width: 340, duration: 0.7, ease: "power2.inOut" }, tfill);
    // labels
    if (labelled) {
      labels.forEach((name, i) => {
        const sp = SPOTS[name]; if (!sp) return;
        const t = isFinite(tl_[i]) ? tl_[i] : TD + 1 + i * 0.4;
        const lg = mk("g", { class: "lbl", opacity: 0 }, g);
        const x1 = sp.p[0], y1 = sp.p[1];
        let x2 = sp.l[0], y2 = sp.l[1];
        const ex = sp.anchor === "start" ? x2 - 14 : x2, ey = sp.anchor === "start" ? y2 - 10 : y2 + 14;
        const ln = mk("path", { class: "lead", d: `M ${x1} ${y1} L ${ex} ${ey}`, pathLength: 1 }, lg);
        ln.style.strokeDasharray = 1; ln.style.strokeDashoffset = 1;
        const dot = mk("circle", { cx: x1, cy: y1, r: 7, fill: INK }, lg);
        const tx = mk("text", { x: x2, y: y2, "text-anchor": sp.anchor }, lg); tx.textContent = name;
        tl.set(lg, { opacity: 1, transformOrigin: `${x2}px ${y2}px` }, t);
        tl.fromTo(dot, { scale: 0, transformOrigin: `${x1}px ${y1}px` }, { scale: 1, duration: 0.18, ease: "back.out(1.4)" }, t);
        tl.to(ln, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(tx, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, t + 0.1);
      });
    }
    return g;
  }
  if (MODE === "compare") {
    const gap = 330 * SC + 20;
    const g1 = eye(X, Y - gap + 10, 1, false, false, false), g2 = eye(X, Y + gap - 10, 2, true, false, true);
    tl.fromTo(g1, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
    tl.fromTo(g2, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
  } else {
    eye(X, Y, 1, "{{floaters}}" === "1", "{{fill}}" === "1", true);
  }
  tl.to(svg, { opacity: 0, duration: 0.2, ease: "power2.in" }, D - 0.2);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
