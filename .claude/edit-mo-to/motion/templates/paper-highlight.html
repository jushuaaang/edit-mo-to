<!--defaults {"hl_rows": "3,7,12", "t_hl": "1.3,3.2,4.6", "callouts": "", "t_callouts": "1.0,1.8", "score": "0", "t_score": "2.6", "scroll": 380, "paper_y": 150, "cy": 700, "score_y": 1330, "bg": "", "paper": "#ffffff", "ink": "#5a1426", "sky": "#6fb4e6", "marker": "#ffe45c", "font": "Inter", "font2": "Playfair Display", "seed": 5, "height": 1920, "duration": 6} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@700;800&family={{font2}}:ital,wght@1,700&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; -webkit-font-smoothing: antialiased; font-family: "{{font}}", sans-serif; }
  #bg { position: absolute; inset: 0; background: {{bg}}; }
  #wrap { position: absolute; left: 0; top: 0; width: 1080px; height: {{height}}px; }
  #paper { position: absolute; left: 110px; width: 860px; height: 2300px; background: {{paper}}; border-radius: 14px; isolation: isolate;
           box-shadow: 0 30px 70px rgba(60,40,50,.18), 0 2px 8px rgba(60,40,50,.10); overflow: hidden; }
  .row { position: absolute; height: 15px; border-radius: 8px; background: #b9c1cb; filter: blur(2.4px); }
  .row.h { background: #7c8795; height: 26px; border-radius: 10px; filter: blur(2.8px); }
  .row.s { height: 11px; background: #cfd5dc; }
  .box { position: absolute; background: #f1f4f7; border-radius: 10px; }
  .hl { position: absolute; background: {{marker}}; mix-blend-mode: multiply; border-radius: 5px; width: 0; opacity: .9; }
  .grid { position: absolute; border: 2px solid #d6dce3; border-radius: 6px; }
  .grid i { position: absolute; background: #d6dce3; }
  .bar { position: absolute; background: #cbd3dc; filter: blur(1.4px); border-radius: 4px 4px 0 0; }
  .call { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; opacity: 0;
          background: #fff; color: {{ink}}; border: 3px solid {{sky}}; border-radius: 999px; padding: 18px 40px; font-weight: 800; font-size: 54px; letter-spacing: -.01em;
          box-shadow: 0 0 0 10px rgba(111,180,230,.18), 0 0 46px rgba(111,180,230,.75), 0 14px 30px rgba(40,30,50,.16); }
  .call.big { isolation: isolate; border-radius: 40px; padding: 10px 54px 30px; font-family: "{{font2}}", serif; font-style: italic; font-weight: 700; font-size: 190px; line-height: 1.05; position: absolute; }
  .call.big u { position: absolute; left: 44px; right: 44px; bottom: 24px; height: 22px; background: {{marker}}; border-radius: 4px; text-decoration: none; transform-origin: 0 50%; }
  .call.big span { position: relative; z-index: 1; }
  #score { position: absolute; left: 270px; width: 540px; height: 300px; background: #fff; border-radius: 34px; opacity: 0;
           box-shadow: 0 0 0 10px rgba(111,180,230,.16), 0 0 46px rgba(111,180,230,.55), 0 14px 30px rgba(40,30,50,.14); }
  #score svg { position: absolute; inset: 0; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="bg" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="wrap" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div id="paper"></div>
    <div id="calls"></div>
    <div id="score"><svg viewBox="0 0 540 300" width="540" height="300"><path d="M 70 40 V 250 H 480" fill="none" stroke="#c9d1da" stroke-width="4" stroke-linecap="round" /><path id="sl" d="M 100 80 C 160 90 200 100 250 140 S 360 200 440 214" fill="none" stroke="{{ink}}" stroke-width="10" stroke-linecap="round" pathLength="1" /><circle id="sd" cx="440" cy="214" r="13" fill="{{ink}}" /><path id="sa" d="M 468 168 V 232 M 440 206 L 468 236 L 496 206" fill="none" stroke="{{sky}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
  </div>
</div>
<script>
  // A generic, brandless published-paper page (all body text is blurred bars, so no real wording appears).
  // The page scrolls up; yellow highlighter wipes over the body rows in hl_rows at t_hl (line by line).
  // callouts = a|*b|c: pills that pop with a soft glow at t_callouts, a leading * makes a big italic serif number
  // with a marker underline (e.g. "Nagaki 2002|*46%"). score=1 draws a small descending line + down arrow (no values).
  const D = Number("{{duration}}"), SC = Number("{{scroll}}"), PY = Number("{{paper_y}}"), CYY = Number("{{cy}}");
  let sd = Number("{{seed}}"); const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const paper = document.getElementById("paper"), tl = gsap.timeline({ paused: true });
  paper.style.top = PY + "px";
  const add = (cls, l, t, w, h, p) => { const e = document.createElement("div"); e.className = cls; e.style.cssText = `left:${l}px;top:${t}px;width:${w}px;height:${h ? h + "px" : ""}`; (p || paper).appendChild(e); return e; };
  // journal strip + title block
  add("row s", 50, 46, 170); add("row s", 700, 46, 110);
  add("row h", 50, 110, 760); add("row h", 50, 156, 640); add("row h", 50, 202, 420);
  [0, 1, 2].forEach(i => add("row s", 50 + i * 190, 270, 150));
  add("box", 50, 330, 760, 150);
  [0, 1, 2, 3, 4].forEach(i => add("row", 74, 350 + i * 26, i === 4 ? 420 : 712));
  add("row h", 50, 520, 210);
  // body rows (two columns), the first column rows are the highlight targets
  const rows = [], cw = 366, top0 = 580, pitch = 30;
  for (let i = 0; i < 24; i++) {
    const w1 = Math.round(cw * (0.86 + rnd() * 0.14)), w2 = Math.round(cw * (0.82 + rnd() * 0.18));
    add("row", 50, top0 + i * pitch, i % 8 === 7 ? Math.round(cw * 0.5) : w1);
    add("row", 444, top0 + i * pitch, i % 8 === 7 ? Math.round(cw * 0.6) : w2);
    rows.push(top0 + i * pitch);
  }
  // figure + table further down
  const figTop = top0 + 24 * pitch + 30;
  add("box", 50, figTop, 760, 340);
  [60, 120, 200, 150, 250, 190].forEach((h, i) => add("bar", 100 + i * 112, figTop + 300 - h, 70, h));
  const tb = add("grid", 50, figTop + 400, 760, 300);
  [75, 150, 225].forEach(y => { const l = document.createElement("i"); l.style.cssText = `left:0;right:0;top:${y}px;height:2px`; tb.appendChild(l); });
  [260, 420, 600].forEach(x => { const l = document.createElement("i"); l.style.cssText = `top:0;bottom:0;left:${x}px;width:2px`; tb.appendChild(l); });
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) add("row s", 50 + [24, 290, 450, 630][c], figTop + 400 + r * 75 + 32, c ? 90 : 190);
  // highlighter wipes
  const hr = "{{hl_rows}}".split(",").map(Number).filter(isFinite), th = "{{t_hl}}".split(",").map(Number);
  hr.forEach((ri, i) => {
    const y = rows[Math.max(0, Math.min(rows.length - 1, ri))], h = add("hl", 44, y - 4, 0, 24);
    const t = isFinite(th[i]) ? th[i] : 1 + i * 1.2;
    tl.to(h, { width: 380, duration: 0.55, ease: "power2.inOut" }, t);
  });
  // paper entrance + scroll + exit
  tl.fromTo("#paper", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
  tl.to("#paper", { y: -SC, duration: D - 0.5, ease: "sine.inOut" }, 0.45);
  // callouts
  const cs = "{{callouts}}".split("|").map(s => s.trim()).filter(Boolean), tc = "{{t_callouts}}".split(",").map(Number);
  const calls = document.getElementById("calls");
  let yy = CYY;
  cs.forEach((txt, i) => {
    const big = txt.startsWith("*"), e = document.createElement("div"); e.className = "call" + (big ? " big" : "");
    if (big) e.innerHTML = "<u></u><span></span>"; (big ? e.querySelector("span") : e).textContent = big ? txt.slice(1) : txt;
    calls.appendChild(e);
    const w = e.offsetWidth, h = e.offsetHeight, x = 540 + (i % 2 ? 90 : -90) - w / 2;
    const y = yy; yy += h + 70;
    e.style.left = Math.round(Math.max(30, Math.min(1080 - 30 - w, x))) + "px"; e.style.top = Math.round(y) + "px";
    const t = isFinite(tc[i]) ? tc[i] : 1 + i * 0.7;
    tl.set(e, { opacity: 1 }, t);
    tl.fromTo(e, { scale: 0.7, y: 16, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.3)", immediateRender: false }, t);
    if (big) tl.fromTo(e.querySelector("u"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.2);
  });
  // score going down
  const sc = document.getElementById("score"), sl = document.getElementById("sl");
  sc.style.top = Number("{{score_y}}") + "px";
  if ("{{score}}" === "1") {
    const t = Number("{{t_score}}");
    sl.style.strokeDasharray = 1; sl.style.strokeDashoffset = 1;
    tl.fromTo(sc, { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, t);
    tl.to(sl, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, t + 0.25);
    tl.fromTo(["#sd", "#sa"], { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t + 1.1);
  }
  tl.to("#wrap", { opacity: 0, duration: 0.2, ease: "power2.in" }, D - 0.2);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
