<!--defaults {"kicker": "EFFECT NAME", "kicker_r": "1 TAKE", "sub": "READ ALOUD", "title": "RECEIPT PRINTER", "total_label": "TOTAL", "total": "2 WORDS", "x": 540, "y": 1180, "width": 620, "paper": "#f3f1ec", "ink": "#16161a", "slot": "#1c1c20", "font": "Space Mono", "size": 64, "height": 1920, "duration": 3.2} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@400;700&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", monospace; -webkit-font-smoothing: antialiased; }
  /* (x, y) = the printer slot's centre; the paper prints upward out of it */
  #stage { position: absolute; inset: 0; }
  #win { position: absolute; left: calc({{x}}px - {{width}}px / 2); width: {{width}}px; bottom: calc({{height}}px - {{y}}px); height: 760px; overflow: hidden; }
  #paper { position: absolute; left: 36px; right: 36px; bottom: 0; padding: 38px 34px 34px; background: {{paper}}; color: {{ink}};
           filter: drop-shadow(0 10px 22px rgba(0,0,0,.35)); }
  #paper::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px;
           background: linear-gradient(135deg, transparent 75%, {{paper}} 75%) 0 0 / 24px 12px, linear-gradient(225deg, transparent 75%, {{paper}} 75%) 0 0 / 24px 12px; }
  .row { display: flex; justify-content: space-between; font-size: 22px; letter-spacing: .12em; font-weight: 700; }
  .row.sub { font-weight: 400; opacity: .6; margin-top: 6px; font-size: 20px; }
  .rule { border-top: 3px dashed {{ink}}; opacity: .5; margin: 22px 0; }
  #big { font-weight: 700; font-size: {{size}}px; line-height: 1.04; letter-spacing: -.02em; text-transform: uppercase; overflow-wrap: anywhere; }
  .row.tot { margin-top: 4px; font-size: 26px; }
  #slot { position: absolute; left: calc({{x}}px - {{width}}px / 2); width: {{width}}px; top: calc({{y}}px - 18px); height: 36px; border-radius: 18px;
          background: {{slot}}; box-shadow: inset 0 3px 0 rgba(255,255,255,.08), 0 10px 26px rgba(0,0,0,.4); }
  #slot::after { content: ""; position: absolute; left: 28px; right: 28px; top: 13px; height: 10px; border-radius: 5px; background: #000; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="stage" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <div id="win"><div id="paper">
      <div class="row"><span>{{kicker}}</span><span>{{kicker_r}}</span></div>
      <div class="row sub"><span>{{sub}}</span></div>
      <div class="rule"></div>
      <div id="big">{{title}}</div>
      <div class="rule"></div>
      <div class="row tot"><span>{{total_label}}</span><span>{{total}}</span></div>
    </div></div>
    <div id="slot"></div>
  </div>
</div>
<script>
  const D = Number("{{duration}}");
  const paper = document.getElementById("paper"), H = paper.offsetHeight + 24;
  const tl = gsap.timeline({ paused: true });
  gsap.set(paper, { y: H });
  tl.from("#slot", { scaleX: 0.6, opacity: 0, duration: 0.16, ease: "power2.out" }, 0);
  // printer feel: the paper feeds out in short stepped bursts, then settles
  tl.to(paper, { y: 0, duration: 0.7, ease: "steps(9)" }, 0.12);
  tl.to(paper, { y: -5, duration: 0.12, ease: "power1.out" }, 0.82);
  tl.to(paper, { y: 0, duration: 0.16, ease: "power2.inOut" }, 0.94);
  tl.to(paper, { y: H, duration: 0.45, ease: "power2.in" }, D - 0.65);
  tl.to("#slot", { opacity: 0, duration: 0.12 }, D - 0.14);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
