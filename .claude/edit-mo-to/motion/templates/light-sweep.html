<!--defaults {"tint": "#8fd3ff", "peak": 0.22, "angle": 18, "dir": "right", "height": 1350, "duration": 0.5} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height={{height}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{height}}px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  /* soft glass glint across the cut: a wide tinted band + a narrow white core, plus a faint full-frame lift */
  #wash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #band { position: absolute; top: -40%; left: 0; width: 900px; height: 180%;
          background: linear-gradient(90deg, rgba(255,255,255,0) 0%, {{tint}}55 30%, rgba(255,255,255,.85) 50%, {{tint}}55 70%, rgba(255,255,255,0) 100%);
          filter: blur(30px); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="{{height}}">
  <div id="wash" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="band" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1"></div>
</div>
<script>
  const D = Number("{{duration}}"), P = Number("{{peak}}"), A = Number("{{angle}}"), R = "{{dir}}" !== "left";
  const tl = gsap.timeline({ paused: true });
  gsap.set("#band", { rotation: A, opacity: 0.9 });
  tl.fromTo("#band", { x: R ? -1100 : 1300 }, { x: R ? 1300 : -1100, duration: D * 0.9, ease: "power2.inOut" }, 0);
  tl.fromTo("#wash", { opacity: 0 }, { opacity: P, duration: D * 0.3, ease: "power2.out" }, 0);
  tl.to("#wash", { opacity: 0, duration: D * 0.6, ease: "power2.in" }, D * 0.3);
  tl.set("#band", { opacity: 0 }, D - 0.02);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
