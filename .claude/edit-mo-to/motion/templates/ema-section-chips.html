<!--defaults {"line1": "Isa-isahin natin", "line2": "ang mga page.", "chips": "Brief|Script|Storyboard|Voiceover|Timing|B-roll & prompts|Clips|Build & QA|Review|Captions|Music|Export", "cards": "", "cards_label": "", "bg": "#EEF5FC", "fg": "#16202C", "accent": "#2F72B8", "chip_bg": "#FFFFFF", "chip_fg": "#2F72B8", "chip_edge": "#D3E2F2", "badge": "#D4AF6A", "badge_fg": "#16202C", "card_bg": "#FFFFFF", "font": "Space Grotesk", "font2": "Inter", "size": 104, "chip_size": 30, "y": "", "t_chips": 0.05, "chip_step": 0.045, "t_line1": 0.15, "t_line2": 0.75, "t_clear": "", "t_cards": "", "card_step": 0.14, "drift": 26, "seed": 7, "fade_out": "1", "width": 1920, "height": 1080, "duration": 3} -->
<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width={{width}}, height={{height}}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@600;700&family={{font2}}:wght@600;700;800&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; background: {{bg}}; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: {{bg}};
          -webkit-font-smoothing: antialiased; }
  .src { display: none; }
  .layer { position: absolute; inset: 0; }
  /* floating tag chips: white pill, thin blue edge, bold blue label */
  .chip { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "{{font2}}", sans-serif; font-weight: 700;
          font-size: {{chip_size}}px; line-height: 1; letter-spacing: -0.005em; color: {{chip_fg}}; background: {{chip_bg}};
          padding: .62em 1.05em; border-radius: 999px; box-shadow: inset 0 0 0 2px {{chip_edge}}, 0 6px 18px rgba(30,70,120,.08); }
  #head { position: absolute; left: 0; width: 100%; text-align: center; font-family: "{{font}}", sans-serif; font-weight: 700; }
  .line { display: block; width: max-content; margin: 0 auto; white-space: nowrap; font-size: {{size}}px; line-height: 1.12;
          letter-spacing: -0.025em; }
  #l1 { color: {{fg}}; }
  #l2 { color: {{accent}}; }
  .w { display: inline-block; white-space: pre; }
  /* optional numbered mini cards */
  #cardsBox { position: absolute; left: 0; width: 100%; text-align: center; }
  #klabel { font-family: "{{font2}}", sans-serif; font-weight: 800; font-size: 24px; letter-spacing: .2em; text-transform: uppercase;
            color: {{accent}}; margin-bottom: 26px; }
  #klabel:empty { display: none; }
  #cards { display: inline-flex; gap: 28px; justify-content: center; }
  .card { width: 250px; background: {{card_bg}}; border-radius: 22px; padding: 26px 20px 24px;
          display: flex; flex-direction: column; align-items: center; gap: 22px;
          box-shadow: inset 0 0 0 1.5px {{chip_edge}}, 0 10px 28px rgba(30,70,120,.09); }
  .badge { width: 52px; height: 52px; border-radius: 50%; background: {{badge}}; color: {{badge_fg}};
           display: flex; align-items: center; justify-content: center; font-family: "{{font2}}", sans-serif;
           font-weight: 800; font-size: 26px; }
  .ctext { font-family: "{{font2}}", sans-serif; font-weight: 700; font-size: 28px; line-height: 1.18; color: {{fg}};
           text-align: center; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="{{width}}" data-height="{{height}}">
  <div class="src" id="s-l1">{{line1}}</div><div class="src" id="s-l2">{{line2}}</div>
  <div class="src" id="s-chips">{{chips}}</div><div class="src" id="s-cards">{{cards}}</div>
  <div id="chipsClip" class="layer clip" data-start="0" data-duration="{{duration}}" data-track-index="0"><div id="chips" class="layer"></div></div>
  <div id="headClip" class="layer clip" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div id="head"><span id="l1" class="line"></span><span id="l2" class="line"></span></div>
  </div>
  <div id="cardsClip" class="layer clip" data-start="0" data-duration="{{duration}}" data-track-index="2">
    <div id="cardsBox"><div id="klabel">{{cards_label}}</div><div id="cards"></div></div>
  </div>
</div>
<script>
  const D = Number("{{duration}}"), W = Number("{{width}}"), H = Number("{{height}}");
  const num = (v, d) => (String(v).trim() === "" || isNaN(Number(v)) ? d : Number(v));
  const txt = id => document.getElementById(id).textContent.trim();
  const list = id => txt(id).split("|").map(s => s.trim()).filter(Boolean);
  const CHIPS = list("s-chips"), CARDS = list("s-cards"), HAS_CARDS = CARDS.length > 0;
  const T_CHIPS = num("{{t_chips}}", 0.05), STEP = num("{{chip_step}}", 0.045);
  const T_L1 = num("{{t_line1}}", 0.15), T_L2 = num("{{t_line2}}", 0.75);
  const T_CLEAR = num("{{t_clear}}", HAS_CARDS ? Math.max(T_L2 + 0.7, D * 0.42) : D - 0.75);
  const T_CARDS = num("{{t_cards}}", T_CLEAR + 0.75), CARD_STEP = num("{{card_step}}", 0.14);
  const DRIFT = num("{{drift}}", 26), FADE_OUT = String("{{fade_out}}").trim() !== "0";
  const HEAD_Y = num("{{y}}", H / 2), HEAD_Y_CARDS = H * 0.27;
  let seed = num("{{seed}}", 7);
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed % 10000) / 10000; };

  // ---- build words (each word animates on its own) ----
  function words(el, s) {
    s.split(/\s+/).filter(Boolean).forEach((w, i, a) => {
      const sp = document.createElement("span"); sp.className = "w"; sp.textContent = w + (i < a.length - 1 ? " " : "");
      el.appendChild(sp);
    });
  }
  const l1 = document.getElementById("l1"), l2 = document.getElementById("l2");
  words(l1, txt("s-l1")); words(l2, txt("s-l2"));

  // ---- chips: rows above and below the headline, staggered, tilted ----
  const chipBox = document.getElementById("chips");
  const chipEls = CHIPS.map(c => { const d = document.createElement("div"); d.className = "chip"; d.textContent = c; chipBox.appendChild(d); return d; });
  const ROWS = CHIPS.length <= 6 ? 2 : 4;
  const ROW_Y = ROWS === 2 ? [0.17, 0.83] : [0.11, 0.27, 0.73, 0.89];
  const per = Math.ceil(CHIPS.length / ROWS);
  const meta = chipEls.map((el, i) => {
    const r = Math.floor(i / per), k = i % per, inRow = Math.min(per, CHIPS.length - r * per);
    const shift = (r % 2 ? 0.5 : -0.5) * (0.35 / inRow);
    return { el, r, fx: (k + 0.5) / inRow + shift, jy: (rnd() - 0.5) * 0.035, rot: (rnd() - 0.5) * 9,
             dx: (rnd() - 0.5) * DRIFT * 1.4, dy: (rnd() - 0.5) * DRIFT, dr: (rnd() - 0.5) * 4 };
  });
  function layoutChips() {
    chipEls.forEach(el => (el.style.fontSize = ""));
    // shrink every chip together if any row would not fit the safe width
    let worst = 1;
    for (let r = 0; r < ROWS; r++) {
      const row = meta.filter(m => m.r === r);
      const tot = row.reduce((s, m) => s + m.el.offsetWidth, 0) + Math.max(0, row.length - 1) * 70;
      if (tot > W - 160) worst = Math.min(worst, (W - 160) / tot);
    }
    if (worst < 1) chipEls.forEach(el => (el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * worst) + "px"));
    meta.forEach(m => {
      const w = m.el.offsetWidth, h = m.el.offsetHeight, pad = 60 + Math.abs(DRIFT);
      const cx = Math.min(W - pad - w / 2, Math.max(pad + w / 2, m.fx * W));
      const cy = (ROW_Y[m.r] + m.jy) * H;
      m.el.style.left = (cx - w / 2) + "px"; m.el.style.top = (cy - h / 2) + "px";
    });
  }

  // ---- headline + cards layout (big text auto-fits the safe width) ----
  const head = document.getElementById("head"), cardsBox = document.getElementById("cardsBox"), cardsEl = document.getElementById("cards");
  CARDS.forEach((c, i) => {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = '<div class="badge"></div><div class="ctext"></div>';
    d.firstChild.textContent = String(i + 1); d.lastChild.textContent = c; cardsEl.appendChild(d);
  });
  function fitW(el, maxW) {
    el.style.fontSize = "";
    const w = el.getBoundingClientRect().width / (gsap.getProperty(el, "scaleX") || 1);
    if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + "px";
  }
  function layout() {
    const safe = Math.min(W - 240, 1600);
    fitW(l1, safe); fitW(l2, safe);
    head.style.top = (HEAD_Y - head.offsetHeight / 2) + "px";
    if (HAS_CARDS) {
      const n = CARDS.length, cw = Math.min(250, (W - 200 - (n - 1) * 28) / n);
      [...cardsEl.children].forEach(c => (c.style.width = cw + "px"));
      cardsBox.style.top = (H * 0.63 - cardsBox.offsetHeight / 2) + "px";
    }
    layoutChips();
  }
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  // ---- timeline ----
  const tl = gsap.timeline({ paused: true });
  gsap.set("#cardsBox", { opacity: HAS_CARDS ? 1 : 0 });
  // chips float in: small rise, blur to sharp, tiny overshoot
  meta.forEach((m, i) => {
    const t = T_CHIPS + i * STEP;
    tl.fromTo(m.el, { opacity: 0, y: 22, scale: 0.86, rotation: m.rot * 0.4, filter: "blur(6px)" },
                    { opacity: 1, y: 0, scale: 1, rotation: m.rot, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.3)" }, t);
    // slow drift for the whole hold
    tl.to(m.el, { x: m.dx, y: m.dy, rotation: m.rot + m.dr, duration: Math.max(0.3, T_CLEAR - t - 0.5), ease: "sine.inOut" }, t + 0.5);
    // clear: drift away from the centre, blur out
    const away = m.r < ROWS / 2 ? -1 : 1;
    tl.to(m.el, { opacity: 0, y: m.dy + away * 40, x: m.dx * 1.6, filter: "blur(8px)", duration: 0.42, ease: "power2.in" },
          T_CLEAR + rnd() * 0.12);
  });
  // headline: line 1 word by word, line 2 in the accent on its word
  const wordIn = (els, t, step) => tl.fromTo(els, { opacity: 0, y: 34, filter: "blur(10px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: step }, t);
  wordIn(l1.querySelectorAll(".w"), T_L1, 0.07);
  wordIn(l2.querySelectorAll(".w"), T_L2, 0.08);
  // cards: headline rises, the label and numbered cards build in under it
  if (HAS_CARDS) {
    tl.to(head, { y: () => HEAD_Y_CARDS - HEAD_Y, scale: 0.82, duration: 0.6, ease: "power3.inOut" }, T_CLEAR + 0.4);
    tl.fromTo("#klabel", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T_CARDS);
    [...cardsEl.children].forEach((c, i) => {
      const t = T_CARDS + 0.1 + i * CARD_STEP;
      tl.fromTo(c, { opacity: 0, y: 30, scale: 0.92, filter: "blur(6px)" },
                   { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.2)" }, t);
      tl.fromTo(c.firstChild, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t + 0.12);
    });
  }
  // exit: everything clears to the plain scene colour (the background stays opaque for the cut)
  if (FADE_OUT) {
    tl.to(["#head", "#cardsBox"], { opacity: 0, y: "-=18", filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, D - 0.3);
  }
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
