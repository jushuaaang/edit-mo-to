<!--defaults {"text": "100% MONEY-BACK", "accent": "", "bg": "#1d3fbf", "fg": "#ffffff", "accent_color": "#ffd23f", "border": "#ffffff", "font": "Montserrat", "size": 76, "top": 300, "duration": 4} -->
<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{font}}:wght@800;900&display=block" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: "{{font}}", sans-serif; font-weight: 900; }
  #b { position: absolute; top: {{top}}px; left: 50%; background: {{bg}}; color: {{fg}}; font-size: {{size}}px;
       letter-spacing: -0.01em; padding: 24px 52px; border-radius: 28px; border: 6px solid {{border}};
       box-shadow: 0 16px 40px rgba(0,0,0,.45); white-space: nowrap; }
  #b span { color: {{accent_color}}; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
  <div id="b" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"><span>{{accent}}</span> {{text}}</div>
</div>
<script>
  const D = {{duration}};
  // auto-fit: shrink text that would run past the safe width (measured with the real font)
  function fitW(el, maxW) {
    el.style.fontSize = "";
    const w = el.getBoundingClientRect().width / (gsap.getProperty(el, "scaleX") || 1);
    if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + "px";
  }
  function fitAll() { fitW(document.getElementById("b"), 1000); }
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  const tl = gsap.timeline({ paused: true });
  gsap.set("#b", { xPercent: -50 });
  tl.fromTo("#b", { scale: 0, rotation: -8, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.05);
  tl.to("#b", { scale: 1.04, duration: 0.5, yoyo: true, repeat: Math.max(0, Math.floor((D - 1.2) / 0.5) - 1), ease: "sine.inOut" }, 0.6);
  tl.to("#b", { scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" }, D - 0.3);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
