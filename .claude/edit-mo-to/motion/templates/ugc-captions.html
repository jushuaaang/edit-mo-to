<!--defaults {"words_file": "{\"words\":[{\"word\":\"Before\",\"start\":0.0,\"end\":0.3},{\"word\":\"you\",\"start\":0.3,\"end\":0.45},{\"word\":\"buy\",\"start\":0.45,\"end\":0.7},{\"word\":\"this,\",\"start\":0.7,\"end\":1.1},{\"word\":\"watch\",\"start\":1.3,\"end\":1.6},{\"word\":\"the\",\"start\":1.6,\"end\":1.7},{\"word\":\"whole\",\"start\":1.7,\"end\":1.95},{\"word\":\"video,\",\"start\":1.95,\"end\":2.4},{\"word\":\"because\",\"start\":2.6,\"end\":2.9},{\"word\":\"I\",\"start\":2.9,\"end\":3.0},{\"word\":\"owe\",\"start\":3.0,\"end\":3.2},{\"word\":\"you\",\"start\":3.2,\"end\":3.35},{\"word\":\"an\",\"start\":3.35,\"end\":3.45},{\"word\":\"apology.\",\"start\":3.45,\"end\":4.0}]}", "script_file": "Before you buy this, watch the whole video, because I owe you an apology.", "t_from": 0, "t_to": "", "max_words": 5, "max_chars": 22, "pause": 0.25, "long_pause": 0.6, "linger": 0.3, "y": 1350, "max_width": 960, "font": "Inter", "weight": 600, "size": 60, "line_height": 1.16, "fg": "#ffffff", "shadow": "0 0 2px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.5), 0 3px 18px rgba(0,0,0,0.45)", "stroke": 0, "stroke_color": "rgba(0,0,0,0.55)", "case": "script", "punct": "end", "highlight": "none", "accent": "#ffd84a", "pop": 0.133, "duration": 4.4, "keep_case": ""} -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family={{font}}:wght@400;500;600;700;800&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; }
  #wrap { position: absolute; inset: 0; }
  .data { display: none; }
  .cap { position: absolute; left: 540px; top: {{y}}px; width: max-content; text-align: center;
         font-family: "{{font}}", -apple-system, "Segoe UI", sans-serif; font-weight: {{weight}};
         font-size: {{size}}px; line-height: {{line_height}}; letter-spacing: -0.005em; color: {{fg}};
         text-shadow: {{shadow}}; -webkit-text-stroke: {{stroke}}px {{stroke_color}}; paint-order: stroke fill;
         visibility: hidden; opacity: 0; white-space: nowrap; }
  .cap .ln { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
  <div id="wrap" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0"></div>
  <div id="wf" class="data">{{words_file}}</div>
  <div id="sf" class="data">{{script_file}}</div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const D = Number("{{duration}}");
  const T0 = Number("{{t_from}}") || 0;
  const T1 = "{{t_to}}".trim() === "" ? T0 + D : Math.min(Number("{{t_to}}"), T0 + D);
  const MAXW = Math.max(1, Number("{{max_words}}") || 5), MAXC = Math.max(8, Number("{{max_chars}}") || 22);
  const PAUSE = Number("{{pause}}"), LONG = Number("{{long_pause}}"), LINGER = Number("{{linger}}");
  const POP = Math.max(0.01, Number("{{pop}}") || 0.133), SAFE = Number("{{max_width}}") || 960;
  const KEEP = "{{keep_case}}".split(",").map(w => w.trim()).filter(Boolean);
  const CASE = "{{case}}", PUNCT = "{{punct}}", HL = "{{highlight}}", FG = "{{fg}}", ACC = "{{accent}}";

  // ---------- inputs ----------
  let raw = [];
  try { const j = JSON.parse(document.getElementById("wf").textContent); raw = (j.words || j).filter(w => w && w.word != null); } catch (e) { raw = []; }
  raw = raw.map(w => ({ word: String(w.word).trim(), start: Number(w.start), end: Number(w.end) })).filter(w => w.word);
  // whisper splits elisions and percents ("l 'energia", "70 %"): glue them back
  const asr = [];
  for (const w of raw) {
    const p = asr[asr.length - 1];
    if (p && (/^['’]/.test(w.word) || /^[%‰]/.test(w.word) || /['’]$/.test(p.word))) { p.word += w.word; p.end = w.end; }
    else asr.push({ ...w });
  }
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

  // ---------- script words take the ASR timings (char-level alignment) ----------
  let words = asr;
  const scriptText = document.getElementById("sf").textContent.trim();
  if (scriptText) {
    const st = [];
    scriptText.split(/\n+/).forEach(line => {
      const toks = line.trim().split(/\s+/).filter(Boolean);
      toks.forEach((t, i) => st.push({ word: t, lineEnd: i === toks.length - 1 }));
    });
    const A = [], aTok = [], B = [], bTok = [];
    st.forEach((t, i) => { for (const c of norm(t.word)) { A.push(c); aTok.push(i); } });
    asr.forEach((t, i) => { for (const c of norm(t.word)) { B.push(c); bTok.push(i); } });
    const n = A.length, m = B.length, W = m + 1;
    const dir = new Uint8Array((n + 1) * W); let prev = new Int32Array(W), cur = new Int32Array(W);
    for (let j = 0; j <= m; j++) { prev[j] = j; dir[j] = 2; }
    for (let i = 1; i <= n; i++) {
      cur[0] = i; dir[i * W] = 1;
      for (let j = 1; j <= m; j++) {
        const d = prev[j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1), u = prev[j] + 1, l = cur[j - 1] + 1;
        if (d <= u && d <= l) { cur[j] = d; dir[i * W + j] = 0; } else if (u <= l) { cur[j] = u; dir[i * W + j] = 1; } else { cur[j] = l; dir[i * W + j] = 2; }
      }
      [prev, cur] = [cur, prev];
    }
    const map = new Int32Array(n).fill(-1);
    for (let i = n, j = m; i > 0 || j > 0;) {
      const d = dir[i * W + j];
      if (i > 0 && j > 0 && d === 0) { map[i - 1] = j - 1; i--; j--; } else if (i > 0 && (j === 0 || d === 1)) i--; else j--;
    }
    st.forEach(t => { t.start = Infinity; t.end = -Infinity; });
    for (let i = 0; i < n; i++) if (map[i] >= 0) { const t = st[aTok[i]], a = asr[bTok[map[i]]]; t.start = Math.min(t.start, a.start); t.end = Math.max(t.end, a.end); }
    // words the ASR missed sit between their neighbours
    for (let i = 0; i < st.length; i++) if (!isFinite(st[i].start)) {
      let p = i - 1; while (p >= 0 && !isFinite(st[p].start)) p--;
      let q = i + 1; while (q < st.length && !isFinite(st[q].start)) q++;
      const a = p >= 0 ? st[p].end : (q < st.length ? st[q].start : 0), b = q < st.length ? st[q].start : a + 0.3;
      st[i].start = a; st[i].end = Math.max(a, b);
    }
    for (let i = 1; i < st.length; i++) if (st[i].start < st[i - 1].start) st[i].start = st[i - 1].start;
    words = st;
  }

  // ---------- keep the [t_from, t_to) window ----------
  const ws = words.filter(w => { const mid = (w.start + w.end) / 2; return mid >= T0 && mid < T1; });
  const FUNC = new Set("di a da in con su per tra fra il lo la i gli le un uno una e ed o che del dello della dei degli delle al allo alla ai agli alle dal dalla dai nel nella nei nelle sul sulla sui ma se non mi ti ci si vi ne come quando quelle quello questa questo tutti tutte il tuo tua mio mia nostra nostro prima dopo invece davanti insieme oltre fino vicino accanto aver avere essere ho hai ha abbiamo hanno sono sei è più molto sola solo".split(" "));
  // noun | adjective ("nebbia mentale", "mosche volanti") should not be split
  const isAdj = t => /^[a-zà-ù]+(ale|ali|ante|anti|ente|enti|ile|ili|oso|osa|osi|ose|ivo|iva|ivi|ive)[.,;:!?]*$/.test(t.word);
  const isNum = t => /^\d+([.,]\d+)?$/.test(t.word);
  const isFunc = t => FUNC.has(t.word.toLowerCase()) || /['’]$/.test(t.word);
  ws.forEach((w, i) => {
    const nx = ws[i + 1];
    w.hard = /[.!?:…]["»”]?$/.test(w.word) || !!w.lineEnd || !nx;
    w.soft = /[,;—–]["»”]?$/.test(w.word);
    w.gap = nx ? nx.start - w.end : 99;
    w.glue = !!nx && (isNum(w) || /^[%‰]/.test(nx.word));   // "12 milligrammi", "60 giorni" stay together
  });

  // ---------- chunking: sentence -> best split (DP) ----------
  const len = (a, b) => ws.slice(a, b).reduce((s, w) => s + w.word.length, 0) + (b - a - 1);
  const chunks = [];
  // phrases first: cut at punctuation and pauses; a one-word phrase joins the next (or, at a sentence end, the previous)
  const segs = [];
  let s0 = 0;
  for (let i = 0; i < ws.length; i++) {
    const w = ws[i];
    if (!(w.hard || w.soft || w.gap > PAUSE) || w.glue) continue;
    if (i + 1 - s0 === 1 && !w.hard && w.gap <= 1.2 && i + 1 < ws.length) continue;
    if (i + 1 - s0 === 1 && segs.length && !ws[segs[segs.length - 1][1] - 1].hard) segs[segs.length - 1][1] = i + 1;
    else segs.push([s0, i + 1]);
    s0 = i + 1;
  }
  for (const [a0, a1] of segs) {
    const n = a1 - a0;
    const best = new Array(n + 1).fill(Infinity), from = new Array(n + 1).fill(-1); best[0] = 0;
    for (let e = 1; e <= n; e++) for (let b = Math.max(0, e - MAXW); b < e; b++) {
      if (!isFinite(best[b])) continue;
      const k = e - b, c = len(a0 + b, a0 + e), last = ws[a0 + e - 1];
      if (k < 2 && n > 1) continue;                       // no one-word orphans
      if (c > 2 * MAXC && k > 1) continue;                // max two lines
      if (e < n && last.glue) continue;
      let cost = 10 + (k - 4) * (k - 4) * 0.6;
      const span = (e < n ? ws[a0 + e].start : ws[a0 + e - 1].end) - ws[a0 + b].start;
      if (span < 0.7) cost += 10 * (0.7 - span) / 0.7 + 4;   // too quick to read
      if (e < n) cost += (last.soft || last.gap > PAUSE) ? 0 : (isFunc(last) ? 14 : (isFunc(ws[a0 + e]) ? 4 : (isAdj(ws[a0 + e]) ? 9 : 5)));
      for (let q = a0 + b; q < a0 + e - 1; q++) cost += ws[q].soft ? 7 : (ws[q].gap > PAUSE ? 5 : 0);
      if (best[b] + cost < best[e]) { best[e] = best[b] + cost; from[e] = b; }
    }
    if (!isFinite(best[n])) {   // very long words: greedy fill, two lines' worth at most
      let cur = [];
      for (let q = a0; q < a1; q++) {
        if (cur.length && (cur.length >= MAXW || len(q - cur.length, q + 1) > 2 * MAXC)) { chunks.push(cur); cur = []; }
        cur.push(ws[q]);
      }
      if (cur.length) chunks.push(cur);
      continue;
    }
    const cuts = []; for (let e = n; e > 0; e = from[e]) cuts.unshift([from[e], e]);
    cuts.forEach(([b, e]) => chunks.push(ws.slice(a0 + b, a0 + e)));
  }

  // a chunk on screen for under half a second joins a neighbour in the same sentence (if both still fit)
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i], nx = chunks[i + 1], pv = chunks[i - 1];
    if ((nx ? nx[0].start : c[c.length - 1].end) - c[0].start >= 0.5) continue;
    const fits = a => a.length <= MAXW + 1 && a.reduce((s, w) => s + w.word.length + 1, -1) <= 2 * MAXC;
    const canP = pv && !pv[pv.length - 1].hard && fits(pv.concat(c)), canN = nx && !c[c.length - 1].hard && fits(c.concat(nx));
    if (canP && (!canN || pv.length <= nx.length)) { chunks.splice(i - 1, 2, pv.concat(c)); i -= 2; }
    else if (canN) { chunks.splice(i, 2, c.concat(nx)); i -= 1; }
  }

  // ---------- text ----------
  const shown = (w, i, arr) => {
    let t = w.word;
    if (PUNCT === "all") t = t.replace(/(?<!\d)[.,;:]+(?!\d)|[.,;:]+$/g, "");
    else if (PUNCT === "end" && i === arr.length - 1) t = t.replace(/[.,;:—–]+$/, "");
    if (i === 0 && CASE === "lower-start" && !/^[A-ZÀ-Ý]{2,}/.test(t) && !KEEP.includes(t)) t = t.charAt(0).toLowerCase() + t.slice(1);
    if (CASE === "upper") t = t.toUpperCase();
    return t;
  };
  function lines(arr) {
    const txt = arr.map(shown);
    const full = txt.join(" ").length;
    if (full <= MAXC || arr.length < 2) return [txt.map((t, i) => [t, arr[i]])];
    let bestK = 1, bestS = Infinity;
    for (let k = 1; k < arr.length; k++) {
      if (arr[k - 1].glue) continue;
      const l1 = txt.slice(0, k).join(" ").length, l2 = txt.slice(k).join(" ").length;
      const s = Math.abs(l1 - l2) + (l2 > l1 ? 3 : 0) + (k === arr.length - 1 && txt[k].length < 5 ? 20 : 0) + (isFunc(arr[k - 1]) ? 6 : 0);
      if (s < bestS) { bestS = s; bestK = k; }
    }
    return [txt.slice(0, bestK).map((t, i) => [t, arr[i]]), txt.slice(bestK).map((t, i) => [t, arr[bestK + i]])];
  }

  // ---------- build + animate ----------
  const wrap = document.getElementById("wrap");
  const tl = gsap.timeline({ paused: true });
  const els = [];
  window.__captions = [];
  chunks.forEach((c, ci) => {
    const el = document.createElement("div"); el.className = "cap";
    lines(c).forEach(ln => {
      const d = document.createElement("span"); d.className = "ln";
      ln.forEach(([t, w], k) => {
        const s = document.createElement("span"); s.textContent = t; s._w = w;
        d.appendChild(s); if (k < ln.length - 1) d.appendChild(document.createTextNode(" "));
      });
      el.appendChild(d);
    });
    wrap.appendChild(el); els.push(el);
    const tin = Math.max(0, c[0].start - T0), lastEnd = c[c.length - 1].end - T0;
    const nx = chunks[ci + 1], nIn = nx ? nx[0].start - T0 : Infinity;
    let tout = (nx && nIn - lastEnd <= LONG) ? nIn : Math.min(nIn, lastEnd + LINGER);
    tout = Math.min(tout, D);
    gsap.set(el, { xPercent: -50, yPercent: -50 });
    tl.fromTo(el, { autoAlpha: 0, scale: 0.92 }, { autoAlpha: 1, scale: 1, duration: Math.min(POP, Math.max(0.01, tout - tin)), ease: "power2.out", immediateRender: false }, tin);
    if (tout >= nIn - 1e-3) tl.set(el, { autoAlpha: 0 }, tout);
    else tl.to(el, { autoAlpha: 0, duration: Math.min(0.1, Math.max(0.01, tout - tin - POP)), ease: "power1.in" }, Math.max(tin + POP, tout - 0.1));
    if (HL === "active-word") {
      const spans = el.querySelectorAll(".ln > span");
      spans.forEach((s, k) => {
        const on = s._w.start - T0, off = k < spans.length - 1 ? spans[k + 1]._w.start - T0 : tout;
        tl.set(s, { color: ACC }, Math.max(tin, on)); tl.set(s, { color: FG }, Math.max(tin, off));
      });
    }
    window.__captions.push({ text: c.map(shown).join(" "), in: +tin.toFixed(3), out: +tout.toFixed(3) });
  });

  // big text auto-fits (measured with the real font)
  function fitW(el, maxW) {
    el.style.fontSize = "";
    const w = el.getBoundingClientRect().width / (gsap.getProperty(el, "scaleX") || 1);
    if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + "px";
  }
  function fitAll() { els.forEach(el => fitW(el, SAFE)); }
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  if (tl.duration() < D) tl.set({}, {}, D);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
